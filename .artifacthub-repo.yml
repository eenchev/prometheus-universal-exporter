# Artifact Hub repository ownership metadata.
#
# Artifact Hub reads this file from the repository the chart is published from
# and uses it to verify ownership: a repository claiming a repositoryID that is
# not theirs is not indexed. It is not read by Helm and has no effect on the
# chart itself.
#
# repositoryID is the ID Artifact Hub generated when the OCI repository
# ghcr.io/eenchev/charts/prometheus-universal-exporter was registered there.
# Changing it breaks the ownership claim and new versions stop being indexed;
# see docs/RELEASING.md for how it was registered.
repositoryID: "d26dfb9b-d614-40bf-a502-12b0cfcb6ada"
