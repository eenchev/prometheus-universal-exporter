# Dependency updates that GitHub can handle natively. The Dockerfile is not
# covered here: it pins every version through an ARG and interpolates them into
# the FROM lines, which the Docker ecosystem updater cannot resolve. Those are
# updated by .github/workflows/update-docker-deps.yml instead.
#
# Schedules use Europe/Sofia, so a run lands mid-morning on a working day all
# year round rather than drifting an hour when daylight saving changes.
version: 2
updates:
  # A Go major version lives at a different import path, so `go get -u` and
  # Dependabot both stay within the current major by construction: these updates
  # cannot introduce a breaking major bump.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "10:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - go
    groups:
      # One PR for the whole set: these move together and reviewing a single
      # green build beats triaging eight PRs.
      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # A major bump changes the import path and needs code changes, so it is a
      # deliberate piece of work rather than an automated PR.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # The Python modules only the tests use (test/python/requirements.txt):
  # prometheus_client, whose strict OpenMetrics parser the suite runs the
  # exporter's answers through. The libraries the image ships are pinned in
  # the Dockerfile and updated with it.
  - package-ecosystem: pip
    directory: /test/python
    schedule:
      interval: weekly
      day: tuesday
      time: "10:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    ignore:
      # A new major of the strict parser can read the exposition formats
      # differently, which the suite's verdicts rest on: moving to one is a
      # deliberate change, as a Go major is.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Keeps the actions used by CI and the release workflows current. The
  # workflows pin each action to a commit SHA with its release as a comment
  # (`@<sha> # v7.0.1`); Dependabot moves the SHA and rewrites the comment.
  # Unlike the Go modules' and the Python modules', their major versions are
  # proposed: a pinned SHA runs only what was reviewed, and an action's
  # major changes its inputs or its runtime rather than an import path. They
  # come in a pull request of their own, apart from the minor and patch
  # updates, so a major bump is reviewed by itself and never holds up the
  # rest.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "10:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
