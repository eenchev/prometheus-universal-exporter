name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # The tests that need the strict reference parser fail without it
    # instead of being skipped (internal/exporter/openmetricsstrict_test.go).
    env:
      STRICT_OPENMETRICS_PARSER: required
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              # Workflow validity is checked by a Go test, so a change to these
              # files must still run the Go suite.
              - '.github/workflows/**'
              # So is chart manifest separation, and that guard is worth least
              # on exactly the changes that would break it.
              - 'charts/**'
              # The repository tests read these: the schemas are checked
              # against what the code generates, the examples and configs
              # must load, the README's flag table must match the flags, and
              # the Dockerfile, Makefile and tools are checked too.
              - 'configs/**'
              - 'examples/**'
              - 'testdata/**'
              - 'docs/**'
              - '*.md'
              - 'Dockerfile'
              - '.dockerignore'
              - 'Makefile'
              - 'tools/**'
              - '.golangci.yml'
              # The Python modules the tests use: a new version of the
              # reference parser has to be run against the suite.
              - 'test/python/**'
            chart:
              - 'charts/**'
              # The chart steps render configs and testdata files.
              - 'configs/**'
              - 'testdata/chart/**'
      - uses: actions/setup-go@v7
        if: steps.changes.outputs.go == 'true'
        with:
          go-version: 'stable'
      # The helm the Makefile pins (HELM_VERSION); a test keeps them equal.
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
        if: steps.changes.outputs.chart == 'true'
      # The Python tests run against the Python the image ships, the
      # Dockerfile's PYTHON_VERSION, not whichever one the runner happens to
      # have: the sandbox depends on what the standard library imports, which
      # changes between releases (zoneinfo needs threading from 3.12 on).
      - name: Read the Python version the image ships
        id: python
        if: steps.changes.outputs.go == 'true'
        run: |
          set -eu
          version="$(sed -n 's/^ARG PYTHON_VERSION=//p' Dockerfile)"
          if [ -z "$version" ]; then
            echo "the Dockerfile declares no PYTHON_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.go == 'true'
        with:
          python-version: ${{ steps.python.outputs.version }}
      # That Python comes bare, without the runner's system packages. Install
      # the libraries the image ships, at its versions: the Python tests use
      # them as the image does, and tools/check-manifests.py reads YAML.
      - name: Install the Python libraries the image ships
        if: steps.changes.outputs.go == 'true'
        run: |
          set -eu
          arg() { sed -n "s/^ARG $1=//p" Dockerfile; }
          python3 -m pip install --disable-pip-version-check \
            "lxml==$(arg LXML_VERSION)" \
            "PyYAML==$(arg PYYAML_VERSION)" \
            "python-dateutil==$(arg PYTHON_DATEUTIL_VERSION)"
      # The OpenMetrics answers are also given to prometheus_client's parser,
      # the strict reference parser, which the image does not ship. It is
      # installed for the tests alone, at the version test/python pins, and
      # the job's STRICT_OPENMETRICS_PARSER has those tests fail, should the
      # module be missing, where they would otherwise be skipped.
      - name: Install the Python modules only the tests use
        if: steps.changes.outputs.go == 'true'
        run: python3 -m pip install --disable-pip-version-check -r test/python/requirements.txt
      - run: go mod download
        if: steps.changes.outputs.go == 'true'
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
        if: steps.changes.outputs.go == 'true'
      # golangci-lint ships as a binary built with a particular Go release, and
      # its type checker cannot read standard-library sources from a newer one:
      # against a newer toolchain it panics with "file requires newer Go version".
      # So this version has to be one built with at least the Go the build uses,
      # which is the current stable release. The Makefile pins the same version
      # and a test keeps the two in step.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
        if: steps.changes.outputs.go == 'true'
      # What an editor shows comes from gopls, some of whose analyzers
      # golangci-lint does not have. The Makefile pins its version.
      - name: gopls check
        run: make gopls-install gopls-check
        if: steps.changes.outputs.go == 'true'
      - run: go test ./...
        if: steps.changes.outputs.go == 'true'
      # Twice, in a random order, so a test that depends on the order tests
      # run in, or on running only once, is caught. The limit is a package's:
      # go test's own ten minutes are for one run without the race detector,
      # and this is two with it, on whatever machine the job was given. The
      # Makefile runs the same command and a test keeps the two in step.
      - run: go test -race -count=2 -shuffle=on -timeout 20m ./...
        if: steps.changes.outputs.go == 'true'
      - run: go vet ./...
        if: steps.changes.outputs.go == 'true'
      - run: go build ./...
        if: steps.changes.outputs.go == 'true'
      # A build can carry only some request types. Vet and build each type on
      # its own too, so code one type needs cannot quietly depend on another.
      - name: Build with each request type on its own
        run: |
          for type in graphite grpc http localfile; do
            tags="$(sh tools/request-type-tags.sh "$type")"
            go vet -tags "$tags" ./...
            go build -tags "$tags" ./...
          done
        if: steps.changes.outputs.go == 'true'
      # And test each: a build with one type is one the exporter ships, so its
      # tests have to pass too. A test that needs a type says so with a build
      # constraint, so each run is of the tests that build can pass. Once and
      # without -race, which the runs above cover with every type.
      - name: Test with each request type on its own
        run: |
          for type in graphite grpc http localfile; do
            tags="$(sh tools/request-type-tags.sh "$type")"
            go test -count=1 -tags "$tags" ./...
          done
        if: steps.changes.outputs.go == 'true'
      - run: helm lint charts/prometheus-universal-exporter
        if: steps.changes.outputs.chart == 'true'
      - run: helm template test charts/prometheus-universal-exporter
        if: steps.changes.outputs.chart == 'true'
      - run: helm template test charts/prometheus-universal-exporter --set-json 'monitors=[{"name":"service-targets","enabled":true,"type":"service","collector":"example","interval":"30s","scrapeTimeout":"10s"}]'
        if: steps.changes.outputs.chart == 'true'
      - run: helm template test charts/prometheus-universal-exporter --set-json 'monitors=[{"name":"pod-targets","enabled":true,"type":"pod","collector":"example","interval":"30s","scrapeTimeout":"10s"}]'
        if: steps.changes.outputs.chart == 'true'
      - run: helm template test charts/prometheus-universal-exporter --set server.listenAddress=0.0.0.0:9115 --set server.pythonPath=/usr/bin/python3.11
        if: steps.changes.outputs.chart == 'true'
      - run: helm template test charts/prometheus-universal-exporter --set server.expandEnv=true --set-json 'env=[{"name":"DEMO_TARGET","value":"http://api.internal:8080"}]' --set-json 'envFrom=[{"secretRef":{"name":"exporter-secrets"}}]'
        if: steps.changes.outputs.chart == 'true'
      - run: helm template test charts/prometheus-universal-exporter --set staticTargets.enabled=true --set-file staticTargets.data=configs/static-targets.example.yaml --set-file 'config.data.config\.yaml=configs/config.otlp.example.yaml'
        if: steps.changes.outputs.chart == 'true'
      - run: helm template test charts/prometheus-universal-exporter --set server.logLevel=debug --set server.probeTimeoutOffset=1s --set server.probeDefaultTimeout=45s
        if: steps.changes.outputs.chart == 'true'
      - name: Render the shutdown delay and timeout, their grace period and the exporter credential Secret
        if: steps.changes.outputs.chart == 'true'
        run: |
          set -eu
          out="$(helm template test charts/prometheus-universal-exporter --set server.shutdownTimeout=1m)"
          echo "$out" | grep -q -- '--web.shutdown-timeout=1m'
          echo "$out" | grep -q 'terminationGracePeriodSeconds: 75'
          out="$(helm template test charts/prometheus-universal-exporter --set server.shutdownTimeout=15s)"
          if echo "$out" | grep -q terminationGracePeriodSeconds; then
            echo "a grace period was rendered where Kubernetes' default covers the shutdown" >&2
            exit 1
          fi
          out="$(helm template test charts/prometheus-universal-exporter)"
          echo "$out" | grep -q -- '--web.shutdown-delay=5s'
          if echo "$out" | grep -q terminationGracePeriodSeconds; then
            echo "the default shutdown delay and timeout rendered a grace period" >&2
            exit 1
          fi
          out="$(helm template test charts/prometheus-universal-exporter --set server.shutdownDelay=20s)"
          echo "$out" | grep -q -- '--web.shutdown-delay=20s'
          echo "$out" | grep -q 'terminationGracePeriodSeconds: 45'
          helm template test charts/prometheus-universal-exporter --set server.shutdownDelay=0s | grep -q -- '--web.shutdown-delay=0s'
          out="$(helm template test charts/prometheus-universal-exporter --set server.shutdownDelay=)"
          if echo "$out" | grep -q -- '--web.shutdown-delay'; then
            echo "an empty server.shutdownDelay rendered the flag" >&2
            exit 1
          fi
          if helm template test charts/prometheus-universal-exporter --set server.shutdownDelay=10s --set terminationGracePeriodSeconds=20 >/dev/null 2>&1; then
            echo "helm template accepted a grace period shorter than the shutdown delay and timeout" >&2
            exit 1
          fi
          out="$(helm template test charts/prometheus-universal-exporter --set webAuth.enabled=true --set webAuth.secretName=exporter-auth --set-json 'monitors=[{"name":"t","enabled":true,"type":"service","collector":"example"}]')"
          echo "$out" | grep -q 'mountPath: "/var/run/prometheus-universal-exporter/web-auth"'
          echo "$out" | grep -q 'secretName: "exporter-auth"'
          # The probe monitor itself, not only the self-metrics one, has to
          # present the credential, or every probe it sends is a 401.
          echo "$out" | python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          probe = [d for d in docs if d.get("kind") == "ServiceMonitor" and d["metadata"]["name"] == "test-prometheus-universal-exporter-t"]
          if len(probe) != 1:
              sys.exit(f"{len(probe)} probe monitors named test-prometheus-universal-exporter-t were rendered")
          auth = probe[0]["spec"]["endpoints"][0].get("basicAuth") or {}
          if auth.get("username", {}).get("name") != "exporter-auth" or auth.get("password", {}).get("name") != "exporter-auth":
              sys.exit(f"the probe monitor does not present the webAuth Secret: {auth}")
          '
      - run: helm template test charts/prometheus-universal-exporter --set-json 'extraArgs=["--some.new-flag=value"]' --set-json 'extraVolumes=[{"name":"extra-collectors","configMap":{"name":"my-collectors"}}]' --set-json 'extraVolumeMounts=[{"name":"extra-collectors","mountPath":"/etc/collectors","readOnly":true}]'
        if: steps.changes.outputs.chart == 'true'
      - name: Check that every rendered manifest is its own document
        run: |
          helm template test charts/prometheus-universal-exporter \
            --set-json 'monitors=[{"name":"a","enabled":true,"type":"service","collector":"example","interval":"30s","scrapeTimeout":"10s"},{"name":"b","enabled":true,"type":"pod","collector":"example","interval":"30s","scrapeTimeout":"10s"}]' \
            | python3 tools/check-manifests.py
        if: steps.changes.outputs.chart == 'true'
      - name: Render static targets without OTLP, and the monitor of their endpoint
        if: steps.changes.outputs.chart == 'true'
        run: |
          set -eu
          out="$(helm template test charts/prometheus-universal-exporter --set staticTargets.enabled=true --set-file staticTargets.data=testdata/chart/static-targets-endpoint-only.yaml)"
          echo "$out" | grep -q -- '--static-targets-file=/etc/prometheus-universal-exporter/static-targets.yaml'
          echo "$out" | grep -q -- '--web.static-targets-path=/static-targets'
          echo "$out" | grep -q 'name: .*-static-targets$'
          echo "$out" | grep -q 'path: "/static-targets"'
          out="$(helm template test charts/prometheus-universal-exporter --set staticTargets.enabled=true --set-file staticTargets.data=testdata/chart/static-targets-endpoint-only.yaml --set staticTargets.path=/targets --set staticTargets.monitor.type=pod)"
          echo "$out" | grep -q -- '--web.static-targets-path=/targets'
          echo "$out" | grep -q 'kind: PodMonitor'
          out="$(helm template test charts/prometheus-universal-exporter --set staticTargets.enabled=true --set-file staticTargets.data=testdata/chart/static-targets-endpoint-only.yaml --set staticTargets.monitor.enabled=false)"
          if echo "$out" | grep -q -- '-static-targets$'; then
            echo "the static targets monitor rendered with staticTargets.monitor.enabled false" >&2
            exit 1
          fi
          out="$(helm template test charts/prometheus-universal-exporter)"
          if echo "$out" | grep -q -- '--static-targets-file'; then
            echo "--static-targets-file rendered without staticTargets.enabled" >&2
            exit 1
          fi
      - name: Render the Recreate strategy without a rollingUpdate
        if: steps.changes.outputs.chart == 'true'
        run: |
          set -eu
          # Kubernetes refuses a rollingUpdate beside type Recreate, so
          # strategy.type alone has to be enough to switch.
          out="$(helm template test charts/prometheus-universal-exporter --set strategy.type=Recreate)"
          echo "$out" | grep -q 'type: Recreate'
          if echo "$out" | grep -q rollingUpdate; then
            echo "strategy.type Recreate rendered a rollingUpdate" >&2
            exit 1
          fi
      - name: Render the garbage collector's target
        if: steps.changes.outputs.chart == 'true'
        run: |
          set -eu
          # goGC.percent renders GOGC on the exporter container, which the Go
          # runtime reads; the default values render none.
          out="$(helm template test charts/prometheus-universal-exporter --set goGC.percent=400)"
          echo "$out" | grep -q 'name: GOGC'
          echo "$out" | grep -q 'value: "400"'
          out="$(helm template test charts/prometheus-universal-exporter)"
          if echo "$out" | grep -q GOGC; then
            echo "the default values rendered GOGC" >&2
            exit 1
          fi
      - name: Render a monitor's port and namespaces
        if: steps.changes.outputs.chart == 'true'
        run: |
          set -eu
          out="$(helm template test charts/prometheus-universal-exporter --set-json 'monitors=[{"name":"t","enabled":true,"type":"service","collector":"example","interval":"30s","scrapeTimeout":"10s","port":"grpc","namespaceSelector":{"matchNames":["a"]}}]')"
          echo "$out" | grep -q 'port: "grpc"'
          echo "$out" | grep -q 'namespaceSelector:'
          echo "$out" | grep -q '^    - a$'
          out="$(helm template test charts/prometheus-universal-exporter --set-json 'monitors=[{"name":"t","enabled":true,"type":"pod","collector":"example","interval":"30s","scrapeTimeout":"10s","port":"grpc","namespaceSelector":{"matchNames":["a"]}}]')"
          echo "$out" | grep -q 'kind: PodMonitor'
          echo "$out" | grep -q 'port: "grpc"'
          echo "$out" | grep -q 'namespaceSelector:'
          echo "$out" | grep -q '^    - a$'
      - name: Render a configuration file whose first line is indented
        if: steps.changes.outputs.chart == 'true'
        run: |
          set -eu
          # A block scalar takes its indentation from its first line unless it
          # is told otherwise, so such a file used to end the ConfigMap early.
          # The render is kept first: a pipeline would hide helm failing.
          out="$(helm template test charts/prometheus-universal-exporter --set-file 'config.data.extra\.yaml=testdata/chart/indented-first-line.yaml')"
          echo "$out" | grep -q '^      # A file whose first line is indented'
          echo "$out" | python3 tools/check-manifests.py
      - name: Render the chart as a dependency of a parent chart
        if: steps.changes.outputs.chart == 'true'
        run: |
          set -eu
          # helm dependency build writes the dependency and a Chart.lock into
          # the parent, so the parent is built in a copy of the two charts, laid
          # out as they are here for its file:// path to reach the chart. Helm
          # then passes the chart the parent's global values and the enabled
          # its condition reads, which the values schema has to let through.
          tree=$(mktemp -d)
          trap 'rm -rf "$tree"' EXIT
          mkdir -p "$tree/charts" "$tree/testdata/chart"
          cp -R charts/prometheus-universal-exporter "$tree/charts/"
          cp -R testdata/chart/parent "$tree/testdata/chart/"
          helm dependency build "$tree/testdata/chart/parent" >/dev/null
          out="$(helm template test "$tree/testdata/chart/parent" --set prometheus-universal-exporter.enabled=true)"
          echo "$out" | grep -q '^# Source: parent/charts/prometheus-universal-exporter/templates/deployment.yaml$'
          echo "$out" | grep -q 'replicas: 2'
      - name: Reject static targets exported over OTLP without OTLP export
        run: |
          if helm template test charts/prometheus-universal-exporter --set staticTargets.enabled=true --set-file staticTargets.data=configs/static-targets.example.yaml --set-file 'config.data.config\.yaml=configs/config.example.yaml' >/dev/null 2>&1; then
            echo "helm template accepted a static target with export_via_otlp while OTLP export is disabled" >&2
            exit 1
          fi
        if: steps.changes.outputs.chart == 'true'
      - name: Reject extraArgs and mount paths that collide with the chart
        run: |
          # Go keeps the last occurrence of a repeated flag, and a mount over the
          # configuration directory hides config.yaml. Both render happily and
          # then fail at run time pointing somewhere other than the values file.
          if helm template test charts/prometheus-universal-exporter --set-json 'extraArgs=["--web.listen-address=:9999"]' >/dev/null 2>&1; then
            echo "helm template accepted an extraArgs entry overriding a chart-managed flag" >&2
            exit 1
          fi
          if helm template test charts/prometheus-universal-exporter --set-json 'extraArgs=["--log.level=debug"]' >/dev/null 2>&1; then
            echo "helm template accepted --log.level in extraArgs, which server.logLevel manages" >&2
            exit 1
          fi
          for oneshot in --dry-run --config.schema --config.collector-file-schema --static-targets-file-schema --version --help; do
            if helm template test charts/prometheus-universal-exporter --set-json "extraArgs=[\"$oneshot\"]" >/dev/null 2>&1; then
              echo "helm template accepted $oneshot in extraArgs, which would make the pod exit instead of serving" >&2
              exit 1
            fi
          done
          for bad in server.logLevel=verbose server.probeTimeoutOffset=-1s server.probeDefaultTimeout=-1s selfMetrics.path=/probe selfMetrics.path=/stats/ staticTargets.path=/self-metrics staticTargets.path=/probe staticTargets.monitor.type=node server.shutdownTimeout=500ms server.shutdownTimeout=0s server.shutdownDelay=500ms server.shutdownDelay=-1s terminationGracePeriodSeconds=10 webAuth.enabled=true; do
            if helm template test charts/prometheus-universal-exporter --set "$bad" >/dev/null 2>&1; then
              echo "helm template accepted $bad" >&2
              exit 1
            fi
          done
          if helm template test charts/prometheus-universal-exporter --set-json 'extraArgs=["log.level=debug"]' >/dev/null 2>&1; then
            echo "helm template accepted an extraArgs entry that is not a flag" >&2
            exit 1
          fi
          if helm template test charts/prometheus-universal-exporter --set-json 'extraVolumes=[{"name":"shadow","configMap":{"name":"shadow"}}]' --set-json 'extraVolumeMounts=[{"name":"shadow","mountPath":"/etc/prometheus-universal-exporter"}]' >/dev/null 2>&1; then
            echo "helm template accepted an extraVolumeMounts entry hiding the configuration directory" >&2
            exit 1
          fi
          # A trailing slash names the same directory.
          if helm template test charts/prometheus-universal-exporter --set-json 'extraVolumes=[{"name":"shadow","configMap":{"name":"shadow"}}]' --set-json 'extraVolumeMounts=[{"name":"shadow","mountPath":"/etc/prometheus-universal-exporter/"}]' >/dev/null 2>&1; then
            echo "helm template accepted an extraVolumeMounts entry hiding the configuration directory behind a trailing slash" >&2
            exit 1
          fi
          if helm template test charts/prometheus-universal-exporter --set webAuth.enabled=true --set webAuth.secretName=s --set webAuth.mountPath=/etc/prometheus-universal-exporter/ >/dev/null 2>&1; then
            echo "helm template accepted a webAuth.mountPath at the configuration directory with a trailing slash" >&2
            exit 1
          fi
        if: steps.changes.outputs.chart == 'true'
      - name: Reject monitor auth without a type, a monitor's port given as a number, a scrape timeout longer than its interval and an Ingress without the Service
        run: |
          # Each renders manifests that are refused or lead nowhere once they
          # are applied: the operator has no credential to build, no port is
          # named by a number, Prometheus refuses the scrape configuration,
          # and the Ingress has no backend.
          if helm template test charts/prometheus-universal-exporter --set-json 'monitors=[{"name":"t","enabled":true,"type":"service","collector":"example","auth":{"enabled":true,"secretName":"s"}}]' >/dev/null 2>&1; then
            echo "helm template accepted a monitor that enables auth without a type" >&2
            exit 1
          fi
          if helm template test charts/prometheus-universal-exporter --set-json 'monitors=[{"name":"t","enabled":true,"type":"service","collector":"example","port":"9115"}]' >/dev/null 2>&1; then
            echo "helm template accepted a monitor's port given as a number, which names no port" >&2
            exit 1
          fi
          if helm template test charts/prometheus-universal-exporter --set selfMetrics.enabled=true --set selfMetrics.interval=10s --set selfMetrics.scrapeTimeout=5m >/dev/null 2>&1; then
            echo "helm template accepted a selfMetrics.scrapeTimeout longer than selfMetrics.interval" >&2
            exit 1
          fi
          if helm template test charts/prometheus-universal-exporter --set ingress.enabled=true --set service.enabled=false >/dev/null 2>&1; then
            echo "helm template accepted an Ingress without the Service it routes to" >&2
            exit 1
          fi
        if: steps.changes.outputs.chart == 'true'
      - name: Reject a garbage collector target that collects nothing, is 0 or has two sources
        run: |
          # off needs a Go memory limit in force, or the heap grows without
          # bound; 0 is not a target; and GOGC in env beside goGC.percent
          # would give the container the variable twice.
          if helm template test charts/prometheus-universal-exporter --set-string goGC.percent=off --set goMemLimit.enabled=false >/dev/null 2>&1; then
            echo "helm template accepted goGC.percent off with no Go memory limit in force" >&2
            exit 1
          fi
          if helm template test charts/prometheus-universal-exporter --set goGC.percent=0 >/dev/null 2>&1; then
            echo "helm template accepted a goGC.percent of 0" >&2
            exit 1
          fi
          if helm template test charts/prometheus-universal-exporter --set goGC.percent=200 --set-json 'env=[{"name":"GOGC","value":"50"}]' >/dev/null 2>&1; then
            echo "helm template accepted goGC.percent beside a GOGC entry in env" >&2
            exit 1
          fi
        if: steps.changes.outputs.chart == 'true'
      - name: Reject values the schema does not allow
        run: |
          # values.schema.json is what turns a typo into a failed render instead
          # of a pod that starts and quietly ignores the value.
          if helm template test charts/prometheus-universal-exporter --set replicaCount=many >/dev/null 2>&1; then
            echo "helm template accepted a non-integer replicaCount" >&2
            exit 1
          fi
          if helm template test charts/prometheus-universal-exporter --set image.pullPolicy=always >/dev/null 2>&1; then
            echo "helm template accepted an invalid image.pullPolicy" >&2
            exit 1
          fi
          if helm template test charts/prometheus-universal-exporter --set replicaCounts=2 >/dev/null 2>&1; then
            echo "helm template accepted an unknown top-level value" >&2
            exit 1
          fi
        if: steps.changes.outputs.chart == 'true'
      - name: Package the chart
        run: |
          # The same packaging the chart release performs, so a chart that
          # cannot be packaged fails here rather than during a release. The
          # package is rendered again and installed with a client-side dry run,
          # which needs no cluster.
          helm package charts/prometheus-universal-exporter --destination dist
          package=$(ls dist/prometheus-universal-exporter-*.tgz)
          helm template test "$package" >/dev/null
          helm install test "$package" --dry-run=client >/dev/null
        if: steps.changes.outputs.chart == 'true'
      - name: Reject an invalid server.listenAddress
        run: |
          # A bare port renders as valid YAML and then makes the container exit
          # with "missing port in address", so the chart has to reject it here;
          # so is a loopback host, which neither the probes nor the Service reach.
          for address in ':http' '9115' '0.0.0.0' ':0' '127.0.0.1:8080' 'localhost:8080' '[::1]:8080'; do
            if helm template test charts/prometheus-universal-exporter --set "server.listenAddress=$address" >/dev/null 2>&1; then
              echo "helm template accepted the invalid server.listenAddress '$address'" >&2
              exit 1
            fi
          done
        if: steps.changes.outputs.chart == 'true'
