              - 'internal/config/**'
              - 'internal/decode/**'
              - 'internal/exporter/**'
              - 'internal/expr/**'
              - 'internal/fetch/**'
              - 'internal/grpctest/**'
              - 'internal/kubeapi/**'
              - 'internal/kubetest/**'
              - 'internal/model/**'
              - 'internal/sqltest/**'
              - 'internal/sshtest/**'
              - 'internal/testutil/**'
              - 'internal/transform/**'
              - 'tools/depupdate/**'
              # The tests load the examples and configs, read the test data,
              # the chart, the docs and the README, and run the Python of the
