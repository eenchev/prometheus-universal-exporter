name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            chart:
              - 'charts/**'
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.go == 'true'
        with:
          go-version: '1.23.x'
      - uses: azure/setup-helm@v4
        if: steps.changes.outputs.chart == 'true'
      - run: go mod download
        if: steps.changes.outputs.go == 'true'
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l *.go)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
        if: steps.changes.outputs.go == 'true'
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
        if: steps.changes.outputs.go == 'true'
        if: steps.changes.outputs.go == 'true'
      - run: go test ./...
        if: steps.changes.outputs.go == 'true'
      - run: go test -race ./...
        if: steps.changes.outputs.go == 'true'
      - run: go vet ./...
        if: steps.changes.outputs.go == 'true'
      - run: go build ./...
        if: steps.changes.outputs.go == 'true'
      - run: helm lint charts/prometheus-universal-exporter
        if: steps.changes.outputs.chart == 'true'
      - run: helm template test charts/prometheus-universal-exporter
        if: steps.changes.outputs.chart == 'true'
      - run: helm template test charts/prometheus-universal-exporter --set-json 'monitors=[{"name":"service-targets","enabled":true,"type":"service","collector":"example","interval":"30s","scrapeTimeout":"10s"}]'
        if: steps.changes.outputs.chart == 'true'
      - run: helm template test charts/prometheus-universal-exporter --set-json 'monitors=[{"name":"pod-targets","enabled":true,"type":"pod","collector":"example","interval":"30s","scrapeTimeout":"10s"}]'
        if: steps.changes.outputs.chart == 'true'
      - run: helm template test charts/prometheus-universal-exporter --set server.listenAddress=0.0.0.0:9115 --set server.pythonPath=/usr/bin/python3.11
        if: steps.changes.outputs.chart == 'true'
      - run: helm template test charts/prometheus-universal-exporter --set otlpTargets.enabled=true --set-file otlpTargets.data=targets.example.yaml --set-file 'config.data.config\.yaml=config.otlp.example.yaml'
        if: steps.changes.outputs.chart == 'true'
      - name: Reject scheduled targets without OTLP export
        run: |
          if helm template test charts/prometheus-universal-exporter --set otlpTargets.enabled=true --set-file otlpTargets.data=targets.example.yaml --set-file 'config.data.config\.yaml=config.example.yaml' >/dev/null 2>&1; then
            echo "helm template accepted scheduled targets while OTLP export is disabled" >&2
            exit 1
          fi
        if: steps.changes.outputs.chart == 'true'
      - name: Reject an invalid server.listenAddress
        run: |
          if helm template test charts/prometheus-universal-exporter --set server.listenAddress=:http >/dev/null 2>&1; then
            echo "helm template accepted an invalid server.listenAddress" >&2
            exit 1
          fi
        if: steps.changes.outputs.chart == 'true'
