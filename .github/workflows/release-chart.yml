# Releases the Helm chart on its own cycle, independently of the exporter.
# The exporter is released from release.yml on its own tags.
name: release-chart

# Triggered on every tag under the chart/ namespace, not only well-formed
# ones: a malformed release tag must fail loudly rather than silently match no
# workflow and appear to have been released.
on:
  push:
    tags:
      - 'chart/**'
      - 'chart*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! printf '%s' "$TAG" | grep -Eq '^chart/prometheus-universal-exporter-[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag $TAG is not a valid chart release tag" >&2
            echo "expected chart/prometheus-universal-exporter-MAJOR.MINOR.PATCH, for example chart/prometheus-universal-exporter-0.2.0" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # Chart.yaml is the source of truth for the chart version. Releasing a tag
      # that disagrees with it would publish an artifact whose committed
      # definition claims a different version, so the mismatch fails here.
      - name: Verify the tag matches Chart.yaml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          tag_version="${TAG#chart/prometheus-universal-exporter-}"
          chart_version="$(helm show chart charts/prometheus-universal-exporter | awk '/^version:/ {print $2; exit}')"
          if [ "$tag_version" != "$chart_version" ]; then
            echo "tag $TAG implies chart version $tag_version, but Chart.yaml declares $chart_version" >&2
            echo "bump charts/prometheus-universal-exporter/Chart.yaml or retag" >&2
            exit 1
          fi
          echo "version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "releasing chart version $chart_version"

      - run: helm lint charts/prometheus-universal-exporter
      - run: helm template test charts/prometheus-universal-exporter
      - run: helm template test charts/prometheus-universal-exporter --set-json 'monitors=[{"name":"service-targets","enabled":true,"type":"service","collector":"example","interval":"30s","scrapeTimeout":"10s"}]'
      - run: helm template test charts/prometheus-universal-exporter --set-json 'monitors=[{"name":"pod-targets","enabled":true,"type":"pod","collector":"example","interval":"30s","scrapeTimeout":"10s"}]'
      - run: helm template test charts/prometheus-universal-exporter --set server.listenAddress=0.0.0.0:9115 --set server.pythonPath=/usr/bin/python3.11
      - run: helm template test charts/prometheus-universal-exporter --set staticTargets.enabled=true --set-file staticTargets.data=configs/static-targets.example.yaml --set-file 'config.data.config\.yaml=configs/config.otlp.example.yaml'

      # Artifact Hub reads .artifacthub-repo.yml from this repository to verify
      # who owns the OCI repository it indexes. A release that publishes a chart
      # while that file is malformed leaves a package nothing will index, and
      # nothing else in the pipeline would notice.
      - name: Validate the Artifact Hub repository metadata
        run: |
          set -eu
          python3 - <<'PY'
          import re, sys, yaml

          with open(".artifacthub-repo.yml") as handle:
              data = yaml.safe_load(handle)
          if not isinstance(data, dict):
              sys.exit(".artifacthub-repo.yml does not parse as a mapping")
          missing = [key for key in ("repositoryID", "owners") if key not in data]
          if missing:
              sys.exit(".artifacthub-repo.yml is missing: " + ", ".join(missing))
          owners = data["owners"]
          if not isinstance(owners, list) or not owners:
              sys.exit(".artifacthub-repo.yml lists no owners")
          for owner in owners:
              if not isinstance(owner, dict) or not owner.get("name") or not owner.get("email"):
                  sys.exit("every .artifacthub-repo.yml owner needs a name and an email")
          # The repository is registered; anything but the UUID Artifact Hub
          # generated breaks the ownership claim and new versions stop being
          # indexed (see docs/RELEASING.md).
          if not re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", str(data["repositoryID"])):
              sys.exit(".artifacthub-repo.yml repositoryID is not the UUID Artifact Hub generated")
          PY

      # A chart deploys its appVersion's image by default, and the exporter is
      # released on its own tags. Publishing a chart whose default image does
      # not exist yet gives every install an ImagePullBackOff, so the image
      # the chart renders by default has to be in the registry first.
      - name: Verify the chart's default image exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          app_version="$(helm show chart charts/prometheus-universal-exporter | awk '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}')"
          image="$(helm template test charts/prometheus-universal-exporter --show-only templates/deployment.yaml | sed -n 's/^ *image: "\(.*\)"$/\1/p')"
          if [ "$image" != "ghcr.io/${GITHUB_REPOSITORY_OWNER}/prometheus-universal-exporter:${app_version}" ]; then
            echo "the chart deploys $image by default, not ghcr.io/${GITHUB_REPOSITORY_OWNER}/prometheus-universal-exporter:${app_version}, its appVersion's image" >&2
            exit 1
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          if ! docker buildx imagetools inspect "$image"; then
            echo "the chart deploys $image by default, which does not exist" >&2
            echo "release the exporter ${app_version} first (tag exporter/prometheus-universal-exporter-v${app_version}), or set appVersion in Chart.yaml to a released exporter" >&2
            exit 1
          fi

      - name: Install ORAS
        uses: oras-project/setup-oras@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Package and publish the chart
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p dist
          helm package charts/prometheus-universal-exporter --destination dist
          helm install test dist/prometheus-universal-exporter-*.tgz --dry-run=client >/dev/null

          echo "$GH_TOKEN" | helm registry login ghcr.io \
            -u "${GITHUB_ACTOR}" \
            --password-stdin

          # The signature is made for the digest helm pushed, not for the tag,
          # which anyone with write access could move to other content before
          # the signing step reads it.
          pushed="$(helm push dist/prometheus-universal-exporter-*.tgz \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts" 2>&1)"
          printf '%s\n' "$pushed"
          digest="$(printf '%s\n' "$pushed" | sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p')"
          if [ -z "$digest" ]; then
            echo "helm push printed no digest to sign" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Push Artifact Hub repository metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          echo "$GH_TOKEN" | oras login ghcr.io \
            -u "${GITHUB_ACTOR}" \
            --password-stdin

          oras push \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/prometheus-universal-exporter:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            ".artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

      - name: Sign Helm chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/prometheus-universal-exporter@${DIGEST}"

      - name: Verify Helm chart signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/prometheus-universal-exporter@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp \
              "^https://github\.com/eenchev/prometheus-universal-exporter/\.github/workflows/release-chart\.yml@refs/tags/chart/prometheus-universal-exporter-[0-9]+\.[0-9]+\.[0-9]+$"            
      
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tgz --generate-notes --title "Chart ${VERSION}"
