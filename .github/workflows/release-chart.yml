# Releases the Helm chart on its own cycle, independently of the exporter.
# The exporter is released from release.yml on its own tags.
name: release-chart

# Triggered on every tag under the chart/ namespace, not only well-formed
# ones: a malformed release tag must fail loudly rather than silently match no
# workflow and appear to have been released.
on:
  push:
    tags:
      - 'chart/**'
      - 'chart*'

permissions:
  contents: write
  packages: write

jobs:
  release-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! printf '%s' "$TAG" | grep -Eq '^chart/prometheus-universal-exporter-[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag $TAG is not a valid chart release tag" >&2
            echo "expected chart/prometheus-universal-exporter-MAJOR.MINOR.PATCH, for example chart/prometheus-universal-exporter-0.2.0" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # Chart.yaml is the source of truth for the chart version. Releasing a tag
      # that disagrees with it would publish an artifact whose committed
      # definition claims a different version, so the mismatch fails here.
      - name: Verify the tag matches Chart.yaml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          tag_version="${TAG#chart/prometheus-universal-exporter-}"
          chart_version="$(helm show chart charts/prometheus-universal-exporter | awk '/^version:/ {print $2; exit}')"
          if [ "$tag_version" != "$chart_version" ]; then
            echo "tag $TAG implies chart version $tag_version, but Chart.yaml declares $chart_version" >&2
            echo "bump charts/prometheus-universal-exporter/Chart.yaml or retag" >&2
            exit 1
          fi
          echo "version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "releasing chart version $chart_version"

      - run: helm lint charts/prometheus-universal-exporter
      - run: helm template test charts/prometheus-universal-exporter
      - run: helm template test charts/prometheus-universal-exporter --set-json 'monitors=[{"name":"service-targets","enabled":true,"type":"service","collector":"example","interval":"30s","scrapeTimeout":"10s"}]'
      - run: helm template test charts/prometheus-universal-exporter --set-json 'monitors=[{"name":"pod-targets","enabled":true,"type":"pod","collector":"example","interval":"30s","scrapeTimeout":"10s"}]'
      - run: helm template test charts/prometheus-universal-exporter --set server.listenAddress=0.0.0.0:9115 --set server.pythonPath=/usr/bin/python3.11
      - run: helm template test charts/prometheus-universal-exporter --set otlpTargets.enabled=true --set-file otlpTargets.data=targets.example.yaml --set-file 'config.data.config\.yaml=config.otlp.example.yaml'

      # Artifact Hub reads .artifacthub-repo.yml from this repository to verify
      # who owns the OCI repository it indexes. A release that publishes a chart
      # while that file is malformed leaves a package nothing will index, and
      # nothing else in the pipeline would notice.
      - name: Validate the Artifact Hub repository metadata
        run: |
          set -eu
          python3 - <<'PY'
          import sys, yaml

          with open(".artifacthub-repo.yml") as handle:
              data = yaml.safe_load(handle)
          if not isinstance(data, dict):
              sys.exit(".artifacthub-repo.yml does not parse as a mapping")
          missing = [key for key in ("repositoryID", "owners") if key not in data]
          if missing:
              sys.exit(".artifacthub-repo.yml is missing: " + ", ".join(missing))
          owners = data["owners"]
          if not isinstance(owners, list) or not owners:
              sys.exit(".artifacthub-repo.yml lists no owners")
          for owner in owners:
              if not isinstance(owner, dict) or not owner.get("name") or not owner.get("email"):
                  sys.exit("every .artifacthub-repo.yml owner needs a name and an email")
          # The placeholder is expected until the repository is registered: a
          # chart has to be published before Artifact Hub can be pointed at it.
          if str(data["repositoryID"]).startswith("<"):
              print("::warning::.artifacthub-repo.yml still carries the repositoryID placeholder; "
                    "Artifact Hub will not index this repository until it is replaced "
                    "(see docs/RELEASING.md)")
          PY

      # No --version or --app-version override: the packaged chart carries
      # exactly what Chart.yaml declares.
      - name: Package and publish the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p dist
          helm package charts/prometheus-universal-exporter --destination dist
          helm install test dist/prometheus-universal-exporter-*.tgz --dry-run=client >/dev/null
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          helm push dist/prometheus-universal-exporter-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tgz --generate-notes --title "Chart ${VERSION}"
