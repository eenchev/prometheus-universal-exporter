# Releases the exporter itself: container image, binaries, and a GitHub
# Release. The Helm chart has its own cycle in release-chart.yml and is not
# published here.
name: release

# Triggered on every tag under the exporter/ namespace, not only well-formed
# ones: a malformed release tag must fail loudly rather than silently match no
# workflow and appear to have been released.
on:
  push:
    tags:
      - 'exporter/**'
      - 'exporter*'

# Read-only unless a job says otherwise; each job grants itself what it needs
# beyond reading, and a test holds the grants to a list.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Nothing is published unless CI has passed on the commit the tag names
  # (tools/ci-passed.py says what counts), so a tag pushed on a commit CI
  # failed, or never ran on, releases nothing.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! printf '%s' "$TAG" | grep -Eq '^exporter/prometheus-universal-exporter-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag $TAG is not a valid exporter release tag" >&2
            echo "expected exporter/prometheus-universal-exporter-vMAJOR.MINOR.PATCH, for example exporter/prometheus-universal-exporter-v1.0.0" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag push starts a CI run of its own, and a tag is often pushed
      # right after its commit, so CI is waited for rather than required to
      # have finished already.
      - name: Wait for CI to pass on the tagged commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ci-passed.py --repository "$GITHUB_REPOSITORY" --sha "$(git rev-parse HEAD)"

  release:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      # The GitHub Release.
      contents: write
      # The image on GHCR.
      packages: write
      # cosign's keyless signatures of the image and the checksums, from the
      # workflow's OIDC identity.
      id-token: write
    # The tests that need the strict reference parser fail without it
    # instead of being skipped (internal/exporter/openmetricsstrict_test.go).
    env:
      STRICT_OPENMETRICS_PARSER: required
    steps:
      # Every tag, so the release can tell whether it is the newest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The Release's description is the tag's section of CHANGELOG.md
      # (tools/release-notes.sh), read before anything is built, so a release
      # whose section is missing, or does not say what upgrading changes for
      # a user, fails at once rather than after the build.
      - name: Read the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: sh tools/release-notes.sh exporter "${TAG#exporter/prometheus-universal-exporter-v}" > "$RUNNER_TEMP/release-notes.md"

      # The binaries are built with the Go the image is built with: the
      # Dockerfile's GO_VERSION, a minor that setup-go resolves to its newest
      # patch release, as the golang:<minor>-alpine tag does. go.mod's go
      # directive is only the minimum the code needs; building with it would
      # ship an old patch release without its security fixes.
      - name: Read the Go version the image builds with
        id: go
        run: |
          set -eu
          version="$(sed -n 's/^ARG GO_VERSION=//p' Dockerfile)"
          if [ -z "$version" ]; then
            echo "the Dockerfile declares no GO_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
      # The Python tests run against the Python and libraries the image
      # ships, as in ci.yml: a release is not tested against whichever Python
      # the runner happens to have.
      - name: Read the Python version the image ships
        id: python
        run: |
          set -eu
          version="$(sed -n 's/^ARG PYTHON_VERSION=//p' Dockerfile)"
          if [ -z "$version" ]; then
            echo "the Dockerfile declares no PYTHON_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
      - name: Install the Python libraries the image ships
        run: |
          set -eu
          arg() { sed -n "s/^ARG $1=//p" Dockerfile; }
          python3 -m pip install --disable-pip-version-check \
            "lxml==$(arg LXML_VERSION)" \
            "PyYAML==$(arg PYYAML_VERSION)" \
            "python-dateutil==$(arg PYTHON_DATEUTIL_VERSION)"
      # The OpenMetrics answers are also given to prometheus_client's parser,
      # the strict reference parser, which the image does not ship. It is
      # installed for the tests alone, at the version test/python pins, and
      # the job's STRICT_OPENMETRICS_PARSER has those tests fail, should the
      # module be missing, where they would otherwise be skipped.
      - name: Install the Python modules only the tests use
        run: python3 -m pip install --disable-pip-version-check -r test/python/requirements.txt
      - run: go mod download
      - run: go test ./...
      - run: go build ./...

      # The tag carries a prefix, so the version is resolved here rather than
      # parsed out of the ref by the metadata action. The format was already
      # validated above.
      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#exporter/prometheus-universal-exporter-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
          # latest, and the MAJOR.MINOR tag, move only to the newest release
          # of all, and of that minor line: a patch to an older line must not
          # take latest back to it.
          versions="$(git tag -l 'exporter/prometheus-universal-exporter-v*' | sed 's|^exporter/prometheus-universal-exporter-v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          versions="$(printf '%s\n%s\n' "$versions" "$version" | grep -v '^$' | sort -V | uniq)"
          newest="$(printf '%s\n' "$versions" | tail -n 1)"
          newest_in_line="$(printf '%s\n' "$versions" | grep -F "${version%.*}." | grep -E "^${version%.*}\.[0-9]+$" | tail -n 1)"
          echo "latest=$([ "$version" = "$newest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "newest_in_line=$([ "$version" = "$newest_in_line" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Everything is built before anything is published: the archives for
      # every platform, their checksums and the image, so a compile error of
      # one platform alone, darwin's say, fails the release with nothing
      # pushed. Then the image goes out under its version and is signed by
      # its digest, the checksums file is signed, the GitHub Release is
      # published with the archives, the checksums and their signature, and
      # latest and MAJOR.MINOR move last,
      # so a failure at any step leaves latest and MAJOR.MINOR unmoved unless
      # the Release is out, and no Release without its image. A rerun repeats
      # every step: the image's version tag is pushed again, the Release is
      # found and its assets replaced, and the tags move as on the first run
      # (docs/RELEASING.md).
      #
      # The binaries carry the version and the revision the image's are
      # given (the Dockerfile's -ldflags), so --version reports both whichever
      # one a user runs.
      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            output="prometheus-universal-exporter-${VERSION}-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.revision=${REVISION}" -o "dist/$output/prometheus-universal-exporter" .
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.revision=${REVISION}" -o "dist/$output/pue-allocator" ./cmd/pue-allocator
            cp configs/config.example.yaml "dist/$output/"
            tar -czf "dist/$output.tar.gz" -C "dist/$output" .
            rm -rf "dist/$output"
          done
          # A checksum per archive, published with them, so a download can be
          # checked with sha256sum -c.
          (cd dist && sha256sum *.tar.gz > "prometheus-universal-exporter-${VERSION}-sha256sums.txt" && sha256sum -c "prometheus-universal-exporter-${VERSION}-sha256sums.txt")

      # The image's version tag alone: latest and MAJOR.MINOR are moved by
      # the last step, once the Release is out.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built, not pushed: the result stays in the builder's cache, from
      # which the push below takes every layer without building again.
      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is pushed with an SBOM of what it holds and the full
      # provenance of its build, attached to it as attestations, which
      # follow it wherever its digest is copied, latest and MAJOR.MINOR
      # among them.
      - name: Push container image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}

      # Signed by the digest the push reported, not by the version tag,
      # which could be moved to other content before cosign resolves it;
      # latest and MAJOR.MINOR are later pointed at the same digest, so the
      # signature covers them too. The signature is keyless: its
      # certificate names this workflow and the tag it ran for, which is
      # what a user verifies (docs/RELEASING.md), and it is checked here
      # before anything else is published.
      - name: Sign container image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -eu
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
          cosign verify "${IMAGE_NAME}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" > /dev/null

      # The checksums file names every archive's SHA-256, so its signature,
      # a Sigstore bundle published beside it, vouches for every archive.
      - name: Sign the checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          sums="dist/prometheus-universal-exporter-${VERSION}-sha256sums.txt"
          cosign sign-blob --yes --bundle "${sums}.sigstore.json" "$sums"
          cosign verify-blob --bundle "${sums}.sigstore.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            "$sums"

      # Created as a draft with its archives, the checksums and their
      # signature, then published, so the Release never shows without them. On a rerun the Release already exists,
      # draft or published, and gh release create would refuse it: its
      # assets are replaced instead, and its description is set again from
      # CHANGELOG.md, which may have been corrected for the rerun.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz "dist/prometheus-universal-exporter-${VERSION}-sha256sums.txt" "dist/prometheus-universal-exporter-${VERSION}-sha256sums.txt.sigstore.json" --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz "dist/prometheus-universal-exporter-${VERSION}-sha256sums.txt" "dist/prometheus-universal-exporter-${VERSION}-sha256sums.txt.sigstore.json" --draft --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "Exporter v${VERSION}"
          fi
          gh release edit "${GITHUB_REF_NAME}" --draft=false

      # Last: latest and MAJOR.MINOR are pointed at the image the version
      # tag names, by its digest, which copies its manifest and builds
      # nothing.
      - name: Move latest and MAJOR.MINOR
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          MAJOR_MINOR: ${{ steps.version.outputs.major_minor }}
          NEWEST_IN_LINE: ${{ steps.version.outputs.newest_in_line }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -eu
          set --
          if [ "$NEWEST_IN_LINE" = true ]; then
            set -- "$@" --tag "${IMAGE_NAME}:${MAJOR_MINOR}"
          fi
          if [ "$LATEST" = true ]; then
            set -- "$@" --tag "${IMAGE_NAME}:latest"
          fi
          if [ "$#" -gt 0 ]; then
            docker buildx imagetools create "$@" "${IMAGE_NAME}@${DIGEST}"
          fi
