# Updates the versions the Dockerfile pins, which Dependabot cannot read: they
# are held in build arguments and interpolated into the FROM lines and the pip
# install. tools/depupdate resolves them, and the whole suite runs against the
# new versions before a pull request is opened, so an update that breaks the
# build never arrives as one that looks ready to merge.
#
# The schedule is in UTC, which has no daylight saving: 08:00 UTC is 10:00 in
# Sofia in winter and 11:00 in summer, so the run always lands mid-morning on a
# Tuesday rather than in the middle of the night.
name: update-docker-deps
on:
  schedule:
    - cron: '0 8 * * 2'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      # The helm the Makefile pins (HELM_VERSION); a test keeps them equal.
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Resolve newer pinned versions
        run: go run ./tools/depupdate --dockerfile Dockerfile --summary "$RUNNER_TEMP/depupdate.md"
      - name: Record whether anything moved
        id: changes
        run: |
          if git diff --quiet -- Dockerfile; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- Dockerfile
          fi
      # make ci runs gopls check as well as the linter, so it needs both.
      - name: Install the linter and gopls
        run: make lint-install gopls-install
        if: steps.changes.outputs.updated == 'true'
      # The Python tests run against the Python and libraries the updated
      # Dockerfile pins, as in ci.yml, so a new Python or library version that
      # breaks the Python worker fails here rather than after the merge.
      - name: Read the Python version the image ships
        id: python
        if: steps.changes.outputs.updated == 'true'
        run: |
          set -eu
          version="$(sed -n 's/^ARG PYTHON_VERSION=//p' Dockerfile)"
          if [ -z "$version" ]; then
            echo "the Dockerfile declares no PYTHON_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.updated == 'true'
        with:
          python-version: ${{ steps.python.outputs.version }}
      - name: Install the Python libraries the image ships
        if: steps.changes.outputs.updated == 'true'
        run: |
          set -eu
          arg() { sed -n "s/^ARG $1=//p" Dockerfile; }
          python3 -m pip install --disable-pip-version-check \
            "lxml==$(arg LXML_VERSION)" \
            "PyYAML==$(arg PYYAML_VERSION)" \
            "python-dateutil==$(arg PYTHON_DATEUTIL_VERSION)"
      - name: Run the full suite against the new versions
        run: make ci
        if: steps.changes.outputs.updated == 'true'
      - name: Build the image with the new versions
        run: docker build --tag prometheus-universal-exporter:depupdate .
        if: steps.changes.outputs.updated == 'true'
      - uses: peter-evans/create-pull-request@v8
        if: steps.changes.outputs.updated == 'true'
        with:
          branch: deps/dockerfile
          base: main
          title: 'deps: update the versions pinned in the Dockerfile'
          body-path: ${{ runner.temp }}/depupdate.md
          commit-message: 'deps: update the versions pinned in the Dockerfile'
          labels: |
            dependencies
            docker
          delete-branch: true
