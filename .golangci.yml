version: "2"

# Run with `make lint`. CI runs the same configuration, so a clean local run
# means a clean CI run.
run:
  timeout: 5m

linters:
  # The standard set is errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  enable:
    - bodyclose # HTTP response bodies must be closed
    - copyloopvar
    - errorlint # wrapped errors compared with == instead of errors.Is
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx # outbound requests must carry a context
    - perfsprint
    - revive
    - unconvert
    - usestdlibvars # http.MethodGet over "GET", and friends

  settings:
    revive:
      rules:
        - name: empty-block
        - name: error-strings
        - name: errorf
        # Every exported name says what it is for. The comments exclusion
        # preset would hide these findings, so it is not used. The stutter
        # check is off: fetch.FetchCollector and fetch.FetchStage read better
        # at their call sites than fetch.Collector and fetch.Stage would.
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: increment-decrement
        - name: indent-error-flow
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unreachable-code
        - name: var-declaration
    gocritic:
      disabled-checks:
        # The exposition and OTLP writers build strings from small fixed parts;
        # switching them to a different construct would not make them clearer.
        - appendAssign
    gosec:
      excludes:
        # G304 is reported for every file the operator names in configuration:
        # the exporter configuration, the scheduled target document, and the
        # credential files those documents point at. Reading them is the whole
        # point, and the paths come from configuration rather than from a
        # request, so the finding cannot be acted on.
        - G304

  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # Tests exercise failure paths deliberately and do not need the same
      # hardening as the exporter itself.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec
          - noctx
      # G704 reports the outbound request as server-side request forgery, which
      # is an accurate description of what this program is: an exporter whose
      # entire job is to fetch a URL an operator supplied and turn the response
      # into metrics. It cannot be resolved by changing this code. The exposure
      # is bounded where it can be — section 26 of the specification: the scheme
      # allowlist, the response size limit, and the operator's own target
      # allowlist — so the finding is excluded here, and only on the file that
      # makes the request.
      - path: internal/fetch/fetcher\.go
        text: G704
        linters:
          - gosec
      # G703 reports the path the maintainer passes on the command line as
      # attacker-controlled. This is a developer tool run from the repository
      # and from one scheduled workflow; there is no untrusted caller to guard
      # against.
      - path: tools/depupdate/
        text: G703
        linters:
          - gosec

issues:
  # Report every finding rather than the first few per linter, so a CI failure
  # lists the whole job of work.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
