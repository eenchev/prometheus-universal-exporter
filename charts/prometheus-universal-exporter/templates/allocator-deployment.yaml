{{- include "prometheus-universal-exporter.requireBlocks" . -}}
{{- if and .Values.allocator .Values.allocator.enabled }}
{{- $allocator := .Values.allocator }}
{{- $image := $allocator.image | default dict }}
{{- /* --peers.leader-only is a peers' flag, and the instances are peers only
       with a discovery source: the allocator would refuse it without. */}}
{{- if and $allocator.leaderOnly (not (include "prometheus-universal-exporter.allocatorDiscovers" .)) }}
{{- fail "allocator.leaderOnly is true, but no probe job nor discovered_targets entry has a discovery source, so the allocator's pods are no peers and each serves everything: set it false, or add a discovery source" }}
{{- end }}
{{- /* The peers' timings are peers' flags too, refused as leaderOnly is. */}}
{{- if not (include "prometheus-universal-exporter.allocatorDiscovers" .) }}
{{- range $key := list "peerCheckInterval" "peerCheckTimeout" "peerSnapshotTimeout" "peerFailureThreshold" }}
{{- with include "prometheus-universal-exporter.allocatorDuration" (get $allocator $key) }}
{{- fail (printf "allocator.%s is set, but no probe job nor discovered_targets entry has a discovery source, so the allocator's pods are no peers and check none: leave it empty, or add a discovery source" $key) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prometheus-universal-exporter.allocatorFullname" . }}
  {{ with .Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.allocatorLabels" (list .) | nindent 4 }}
  annotations:
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list .) | nindent 4 }}
spec:
  {{- $replicas := include "prometheus-universal-exporter.wholeNumber" (list "allocator.replicas" $allocator.replicas 1 2147483647) }}
  {{- /* With a discovery source the instances are peers: the live instance of the
         lowest pod IP leads and alone asks the sources, and the others serve
         what it found, so any number of them serve the same targets, and a
         RollingUpdate is safe (--peers below). */}}
  replicas: {{ $replicas | default 2 }}
  {{- /* /ready holds before the new pod allocates anything; see the
         helper. */}}
  minReadySeconds: {{ include "prometheus-universal-exporter.allocatorMinReadySeconds" . }}
  selector:
    matchLabels:
      {{- include "prometheus-universal-exporter.allocatorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- /* As for the exporter's pods, allocator.podLabels may not set a
               label the chart sets: allocatorLabels would put the selector's
               two back silently. */}}
        {{- $chartLabels := merge (include "prometheus-universal-exporter.allocatorSelectorLabels" . | fromYaml) (include "prometheus-universal-exporter.labels" . | fromYaml) (dict "app.kubernetes.io/component" "allocator") }}
        {{- range $key, $_ := $allocator.podLabels }}
        {{- if hasKey $chartLabels $key }}
        {{- fail (printf "allocator.podLabels sets %s, which the chart sets itself on every allocator pod (the Deployment finds its pods by app.kubernetes.io/name and app.kubernetes.io/instance); use another label name" $key) }}
        {{- end }}
        {{- end }}
        {{- include "prometheus-universal-exporter.allocatorLabels" (list . $allocator.podLabels) | nindent 8 }}
      annotations:
        {{- /* The allocator reads its files at start, so a change to the
               configuration or a target file rolls it; it keeps no state,
               and the exporter pods keep their last bundle meanwhile. So
               allocator.podAnnotations cannot replace checksum/config. */}}
        {{- $checksum := print (include (print $.Template.BasePath "/configmap.yaml") .) (include (print $.Template.BasePath "/allocator-configmaps.yaml") .) | sha256sum }}
        {{- $podAnnotations := deepCopy ($allocator.podAnnotations | default dict) }}
        {{- $_ := set $podAnnotations "checksum/config" $checksum }}
        {{- include "prometheus-universal-exporter.metadataAnnotations" (list . $podAnnotations) | nindent 8 }}
    spec:
      {{- /* A peer that is stopped keeps serving its shutdown delay first,
             after its preStop hook; see the helper. */}}
      {{- with include "prometheus-universal-exporter.allocatorTerminationGracePeriodSeconds" . }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "prometheus-universal-exporter.allocatorServiceAccountName" . }}
      {{- if include "prometheus-universal-exporter.allocatorUsesKubernetes" . }}
      {{- /* A kubernetes discovery source lists EndpointSlices with the
             account's token, which the chart's Role allows to
             (allocator-rbac.yaml). */}}
      automountServiceAccountToken: true
      {{- else }}
      {{- /* Without a kubernetes discovery source the allocator never calls
             the Kubernetes API either. */}}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- end }}
      {{- with $allocator.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with $allocator.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $allocator.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $allocator.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $allocator.topologySpreadConstraints }}
      {{- /* A constraint without a labelSelector spreads the allocator's
             pods, as its Deployment selects them. */}}
      {{- $constraints := list }}
      {{- range . }}
      {{- $constraint := deepCopy . }}
      {{- if not (hasKey $constraint "labelSelector") }}
      {{- $_ := set $constraint "labelSelector" (dict "matchLabels" (include "prometheus-universal-exporter.allocatorSelectorLabels" $ | fromYaml)) }}
      {{- end }}
      {{- $constraints = append $constraints $constraint }}
      {{- end }}
      topologySpreadConstraints: {{- toYaml $constraints | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: allocator
          image: "{{ $image.repository | default .Values.image.repository }}:{{ $image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $image.pullPolicy | default .Values.image.pullPolicy }}
          {{- /* The image's entrypoint is the exporter; the allocator is the
                 binary beside it. */}}
          command: ["/bin/pue-allocator"]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - "--web.listen-address=:9116"
            - "--config.file=/etc/prometheus-universal-exporter/config.yaml"
            {{- if include "prometheus-universal-exporter.allocatorStaticTargets" . }}
            - "--static-targets-file=/etc/prometheus-universal-exporter-static-targets/static-targets.yaml"
            {{- end }}
            {{- if $allocator.probeJobs }}
            - "--probe-targets-file=/etc/prometheus-universal-exporter-probe-targets/probe-targets.yaml"
            {{- end }}
            - {{ printf "--web.token-file=%s/token" (include "prometheus-universal-exporter.allocatorTokenDir" .) | quote }}
            - {{ printf "--log.level=%s" ($allocator.logLevel | default "info") | quote }}
            {{- with include "prometheus-universal-exporter.allocatorDuration" $allocator.settle }}
            - {{ printf "--settle=%s" . | quote }}
            {{- end }}
            {{- with $allocator.heartbeatInterval }}
            - {{ printf "--heartbeat.interval=%s" . | quote }}
            {{- end }}
            {{- /* Empty leaves the allocator's default; 0, which reads the
                   files once, is a value of its own, not taken for unset. */}}
            {{- with include "prometheus-universal-exporter.allocatorDuration" $allocator.configWatchInterval }}
            - {{ printf "--config.watch-interval=%s" . | quote }}
            {{- end }}
            {{- with include "prometheus-universal-exporter.allocatorDuration" $allocator.discoveryRefreshInterval }}
            - {{ printf "--discovery.refresh-interval=%s" . | quote }}
            {{- end }}
            {{- /* Unset takes the allocator's default, 1000; 0 is refused, not
                   taken for unset. */}}
            - {{ printf "--members.max=%s" (include "prometheus-universal-exporter.wholeNumber" (list "allocator.maxMembers" (ternary 1000 $allocator.maxMembers (kindIs "invalid" $allocator.maxMembers)) 1 2147483647)) | quote }}
            {{- with include "prometheus-universal-exporter.allocatorBalanceFactor" . }}
            - {{ printf "--allocation.balance-factor=%s" . | quote }}
            {{- end }}
            {{- if include "prometheus-universal-exporter.allocatorDiscovers" . }}
            {{- /* The instances find each other by the headless Service's name,
                   the one the exporter pods heartbeat to, and each knows
                   itself among its addresses by its pod IP, even before the
                   Service lists it. */}}
            - {{ printf "--peers=%s.%s.svc:9116" (include "prometheus-universal-exporter.allocatorFullname" .) (include "prometheus-universal-exporter.namespace" .) | quote }}
            - "--peers.self=$(POD_IP)"
            {{- /* Empty, or null for the threshold, leaves the allocator's
                   default. */}}
            {{- with include "prometheus-universal-exporter.allocatorDuration" $allocator.peerCheckInterval }}
            - {{ printf "--peers.check-interval=%s" . | quote }}
            {{- end }}
            {{- with include "prometheus-universal-exporter.allocatorDuration" $allocator.peerCheckTimeout }}
            - {{ printf "--peers.check-timeout=%s" . | quote }}
            {{- end }}
            {{- with include "prometheus-universal-exporter.allocatorDuration" $allocator.peerSnapshotTimeout }}
            - {{ printf "--peers.snapshot-timeout=%s" . | quote }}
            {{- end }}
            {{- with include "prometheus-universal-exporter.wholeNumber" (list "allocator.peerFailureThreshold" $allocator.peerFailureThreshold 1 20) }}
            - {{ printf "--peers.failure-threshold=%s" . | quote }}
            {{- end }}
            {{- if $allocator.leaderOnly }}
            {{- /* Only the leader serves the allocation's metrics, so the
                   ServiceMonitor, which scrapes every pod, gets one pod's
                   series of it; the followers serve the peers' families. */}}
            - "--peers.leader-only"
            {{- end }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
          ports:
            - name: http
              containerPort: 9116
              protocol: TCP
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with $allocator.preStop }}
          lifecycle:
            preStop: {{- toYaml . | nindent 14 }}
          {{- end }}
          resources: {{- toYaml ($allocator.resources | default dict) | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus-universal-exporter
              readOnly: true
            {{- if include "prometheus-universal-exporter.allocatorStaticTargets" . }}
            - name: static-targets
              mountPath: /etc/prometheus-universal-exporter-static-targets
              readOnly: true
            {{- end }}
            {{- if $allocator.probeJobs }}
            - name: probe-targets
              mountPath: /etc/prometheus-universal-exporter-probe-targets
              readOnly: true
            {{- end }}
            - name: token
              mountPath: {{ include "prometheus-universal-exporter.allocatorTokenDir" . }}
              readOnly: true
            {{- include "prometheus-universal-exporter.validateAllocatorMounts" . }}
            {{- with $allocator.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "prometheus-universal-exporter.fullname" . }}
        {{- if include "prometheus-universal-exporter.allocatorStaticTargets" . }}
        - name: static-targets
          configMap:
            name: {{ include "prometheus-universal-exporter.allocatorFullname" . }}-static-targets
        {{- end }}
        {{- if $allocator.probeJobs }}
        - name: probe-targets
          configMap:
            name: {{ include "prometheus-universal-exporter.allocatorFullname" . }}-probe-targets
        {{- end }}
        - name: token
          secret:
            secretName: {{ include "prometheus-universal-exporter.allocatorTokenSecretName" . | quote }}
            defaultMode: 256
            items:
              - key: {{ $allocator.tokenSecret.key | default "token" | quote }}
                path: token
        {{- with $allocator.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
