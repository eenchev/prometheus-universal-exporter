{{- include "prometheus-universal-exporter.requireBlocks" . -}}
{{- if and .Values.allocator .Values.allocator.enabled .Values.allocator.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "prometheus-universal-exporter.allocatorFullname" . }}
  {{ with .Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.allocatorLabels" (list .) | nindent 4 }}
  annotations:
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "prometheus-universal-exporter.allocatorSelectorLabels" . | nindent 6 }}
  {{- /* Callers are this release's exporter pods, which heartbeat and fetch
         their bundles, Prometheus, which fetches the probe targets, and,
         with a discovery source, the other allocator pods, which check each
         other and fetch the leader's discovered targets.
         Egress stays open: the allocator's discovery sources, an http_sd URL,
         the Kubernetes API server or a dns_sd server, are reached through
         it. */}}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "prometheus-universal-exporter.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if include "prometheus-universal-exporter.allocatorDiscovers" . }}
        - podSelector:
            matchLabels:
              {{- include "prometheus-universal-exporter.allocatorSelectorLabels" . | nindent 14 }}
        {{- end }}
        {{- with .Values.allocator.networkPolicy.prometheus }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
