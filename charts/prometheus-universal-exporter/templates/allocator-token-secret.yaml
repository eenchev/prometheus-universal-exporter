{{- /* The allocator's token, generated when allocator.tokenSecret.name names
       no Secret of the operator's: the allocator always requires one, or any
       pod the NetworkPolicy admits could heartbeat as a member and be handed
       targets for Prometheus to probe on it. The token is read back from the
       Secret the release already has, so an upgrade keeps it; helm template
       and a client-side dry run cannot read the cluster, so each of their
       renders generates a new one, which the pods pick up from the mounted
       file once the Secret applied changes. */ -}}
{{- if and .Values.allocator .Values.allocator.enabled (not .Values.allocator.tokenSecret.name) }}
{{- $name := include "prometheus-universal-exporter.allocatorTokenSecretName" . }}
{{- $key := .Values.allocator.tokenSecret.key | default "token" }}
{{- $existing := lookup "v1" "Secret" (include "prometheus-universal-exporter.namespace" .) $name }}
{{- $token := index (($existing | default dict).data | default dict) $key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  {{ with .Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.allocatorLabels" (list .) | nindent 4 }}
  annotations:
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list .) | nindent 4 }}
type: Opaque
data:
  {{ $key | quote }}: {{ $token | default (randAlphaNum 48 | b64enc) | quote }}
{{- end }}
