{{- include "prometheus-universal-exporter.validateTargets" . }}
{{- include "prometheus-universal-exporter.validateMonitors" . }}
{{- include "prometheus-universal-exporter.validateProbe" (list "livenessProbe" .Values.livenessProbe) }}
{{- include "prometheus-universal-exporter.validateProbe" (list "readinessProbe" .Values.readinessProbe) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prometheus-universal-exporter.fullname" . }}
  {{ with .Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.metadataLabels" (list .) | nindent 4 }}
  annotations:
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list .) | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  {{- /* With the HorizontalPodAutoscaler the replica count is its to set: a
         count here would be put back on every upgrade. */}}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy: {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "prometheus-universal-exporter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- /* podLabels may not set a label the chart sets: the selector's
               two would be put back silently, and the Deployment would not
               find its pods if they were not. */}}
        {{- $chartLabels := include "prometheus-universal-exporter.labels" . | fromYaml }}
        {{- range $key, $_ := .Values.podLabels }}
        {{- if hasKey $chartLabels $key }}
        {{- fail (printf "podLabels sets %s, which the chart sets itself on every pod (the Deployment finds its pods by app.kubernetes.io/name and app.kubernetes.io/instance); use another label name" $key) }}
        {{- end }}
        {{- end }}
        {{- include "prometheus-universal-exporter.metadataLabels" (list . .Values.podLabels) | nindent 8 }}
      annotations:
        {{- /* checksum/config rolls the pods when the configuration changes,
               so podAnnotations cannot replace it. */}}
        {{- $podAnnotations := deepCopy (.Values.podAnnotations | default dict) -}}
        {{- $_ := set $podAnnotations "checksum/config" (include (print $.Template.BasePath "/configmap.yaml") . | sha256sum) -}}
        {{- include "prometheus-universal-exporter.metadataAnnotations" (list . $podAnnotations) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "prometheus-universal-exporter.serviceAccountName" . }}
      {{- /* The exporter never calls the Kubernetes API, so no token is
             mounted, whichever account the pod runs as: the default one
             included, with serviceAccount.create=false. */}}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with (include "prometheus-universal-exporter.terminationGracePeriodSeconds" .) }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      {{- /* A constraint without a labelSelector spreads this release's
             pods, as the Deployment selects them. */}}
      {{- $constraints := list }}
      {{- range . }}
      {{- $constraint := deepCopy . }}
      {{- if not (hasKey $constraint "labelSelector") }}
      {{- $_ := set $constraint "labelSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" (include "prometheus-universal-exporter.name" $) "app.kubernetes.io/instance" $.Release.Name)) }}
      {{- end }}
      {{- $constraints = append $constraints $constraint }}
      {{- end }}
      topologySpreadConstraints: {{- toYaml $constraints | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --config.file=/etc/prometheus-universal-exporter/config.yaml
            - {{ printf "--web.listen-address=%s" (include "prometheus-universal-exporter.listenAddress" .) | quote }}
            - {{ printf "--web.self-metrics-path=%s" .Values.selfMetrics.path | quote }}
            - {{ printf "--python.path=%s" (include "prometheus-universal-exporter.pythonPath" .) | quote }}
            {{- if .Values.server.watchConfig }}
            - --config.watch
            - {{ printf "--config.watch-interval=%s" (include "prometheus-universal-exporter.watchConfigInterval" .) | quote }}
            {{- end }}
            - {{ printf "--web.static-targets-path=%s" (include "prometheus-universal-exporter.staticTargetsPath" .) | quote }}
            {{- if .Values.staticTargets.enabled }}
            - {{ printf "--static-targets-file=/etc/prometheus-universal-exporter/%s" (include "prometheus-universal-exporter.staticTargetsFile" .) | quote }}
            {{- if .Values.staticTargets.expandEnv }}
            - --static-targets.expand-env
            {{- end }}
            {{- end }}
            {{- if .Values.server.expandEnv }}
            - --config.expand-env
            {{- end }}
            - {{ printf "--log.level=%s" (include "prometheus-universal-exporter.logLevel" .) | quote }}
            {{- if .Values.server.enableLifecycle }}
            - --web.enable-lifecycle
            {{- end }}
            {{- if .Values.server.probeDebug }}
            - --web.enable-probe-debug
            {{- end }}
            {{- with (include "prometheus-universal-exporter.probeTimeoutOffset" .) }}
            - {{ printf "--probe.timeout-offset=%s" . | quote }}
            {{- end }}
            {{- with (include "prometheus-universal-exporter.probeDefaultTimeout" .) }}
            - {{ printf "--probe.default-timeout=%s" . | quote }}
            {{- end }}
            {{- with (include "prometheus-universal-exporter.countFlag" (list "server.probeMaxConcurrent" .Values.server.probeMaxConcurrent)) }}
            - {{ printf "--probe.max-concurrent=%s" . | quote }}
            {{- end }}
            {{- with (include "prometheus-universal-exporter.countFlag" (list "server.pythonMaxWorkers" .Values.server.pythonMaxWorkers)) }}
            - {{ printf "--python.max-workers=%s" . | quote }}
            {{- end }}
            {{- with (include "prometheus-universal-exporter.memoryLimitRatio" .) }}
            - {{ printf "--runtime.memory-limit-ratio=%s" . | quote }}
            {{- end }}
            {{- with (include "prometheus-universal-exporter.shutdownTimeout" .) }}
            - {{ printf "--web.shutdown-timeout=%s" . | quote }}
            {{- end }}
            {{- with (include "prometheus-universal-exporter.shutdownDelay" .) }}
            - {{ printf "--web.shutdown-delay=%s" . | quote }}
            {{- end }}
            {{- include "prometheus-universal-exporter.extraArgs" . }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.env }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ include "prometheus-universal-exporter.containerPort" . }}
              protocol: TCP
          livenessProbe:
            httpGet: {path: /health, port: http}
            {{- with .Values.livenessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            {{- with .Values.readinessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus-universal-exporter
              readOnly: true
            {{- if and .Values.targetAuth .Values.targetAuth.enabled }}
            - name: target-auth
              mountPath: {{ .Values.targetAuth.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if and .Values.webAuth .Values.webAuth.enabled }}
            - name: web-auth
              mountPath: {{ .Values.webAuth.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- include "prometheus-universal-exporter.validateExtraMounts" . }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "prometheus-universal-exporter.fullname" . }}
        {{- if and .Values.targetAuth .Values.targetAuth.enabled }}
        - name: target-auth
          secret:
            secretName: {{ required "targetAuth.secretName is required when targetAuth.enabled is true" .Values.targetAuth.secretName | quote }}
            items:
              {{- if eq .Values.targetAuth.type "basic" }}
              - key: {{ .Values.targetAuth.usernameKey | quote }}
                path: {{ .Values.targetAuth.usernameFileName | quote }}
              - key: {{ .Values.targetAuth.passwordKey | quote }}
                path: {{ .Values.targetAuth.passwordFileName | quote }}
              {{- else }}
              - key: {{ .Values.targetAuth.secretKey | quote }}
                path: {{ .Values.targetAuth.fileName | quote }}
              {{- end }}
        {{- end }}
        {{- if and .Values.webAuth .Values.webAuth.enabled }}
        - name: web-auth
          secret:
            secretName: {{ required "webAuth.secretName is required when webAuth.enabled is true" .Values.webAuth.secretName | quote }}
            items:
              - key: {{ .Values.webAuth.usernameKey | quote }}
                path: username
              - key: {{ .Values.webAuth.passwordKey | quote }}
                path: password
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
