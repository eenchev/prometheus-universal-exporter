{{- include "prometheus-universal-exporter.validateConfigData" . }}
{{- include "prometheus-universal-exporter.validateTargets" . }}
{{- include "prometheus-universal-exporter.validateMonitors" . }}
{{- include "prometheus-universal-exporter.validateProbe" (list "livenessProbe" .Values.livenessProbe) }}
{{- include "prometheus-universal-exporter.validateProbe" (list "readinessProbe" .Values.readinessProbe) }}
{{- include "prometheus-universal-exporter.validateSSHAuth" . }}
{{- include "prometheus-universal-exporter.validateSQLAuth" . }}
{{- include "prometheus-universal-exporter.validateAllocator" . }}
{{- $allocator := and .Values.allocator .Values.allocator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prometheus-universal-exporter.fullname" . }}
  {{ with .Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.metadataLabels" (list .) | nindent 4 }}
  annotations:
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list .) | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  {{- /* With the HorizontalPodAutoscaler the replica count is its to set: a
         count here would be put back on every upgrade. */}}
  replicas: {{ include "prometheus-universal-exporter.wholeNumber" (list "replicaCount" .Values.replicaCount 0 2147483647) }}
  {{- end }}
  {{- /* rollingUpdate belongs to the RollingUpdate strategy alone: Kubernetes
         refuses a Deployment that carries it with Recreate, and the default
         values carry it, so it is left out for any other type. */}}
  {{- $strategy := .Values.strategy | default dict }}
  {{- $strategyType := $strategy.type | default "RollingUpdate" }}
  strategy:
    type: {{ $strategyType }}
    {{- if and (eq $strategyType "RollingUpdate") $strategy.rollingUpdate }}
    {{- include "prometheus-universal-exporter.rollingUpdateCheck" $strategy.rollingUpdate }}
    rollingUpdate: {{- toYaml $strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "prometheus-universal-exporter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- /* podLabels may not set a label the chart sets: the selector's
               two would be put back silently, and the Deployment would not
               find its pods if they were not. */}}
        {{- $chartLabels := include "prometheus-universal-exporter.labels" . | fromYaml }}
        {{- range $key, $_ := .Values.podLabels }}
        {{- if hasKey $chartLabels $key }}
        {{- fail (printf "podLabels sets %s, which the chart sets itself on every pod (the Deployment finds its pods by app.kubernetes.io/name and app.kubernetes.io/instance); use another label name" $key) }}
        {{- end }}
        {{- end }}
        {{- include "prometheus-universal-exporter.metadataLabels" (list . .Values.podLabels) | nindent 8 }}
      annotations:
        {{- /* checksum/config rolls the pods when the configuration changes,
               or the static target document or the known_hosts lines of
               sshAuth.knownHosts do, so podAnnotations cannot replace it.
               Without those their templates render nothing but white space,
               which is trimmed, so the checksum is the configuration's
               alone. */}}
        {{- /* In allocator mode the configuration reaches the pods from
               the allocator, without a restart, so it is left out. */}}
        {{- $podAnnotations := deepCopy (.Values.podAnnotations | default dict) -}}
        {{- if $allocator -}}
        {{- $_ := set $podAnnotations "checksum/config" (include (print $.Template.BasePath "/sshknownhosts.yaml") . | trim | sha256sum) -}}
        {{- else -}}
        {{- $_ := set $podAnnotations "checksum/config" (print (include (print $.Template.BasePath "/configmap.yaml") .) (include (print $.Template.BasePath "/statictargetsconfigmap.yaml") . | trim) (include (print $.Template.BasePath "/sshknownhosts.yaml") . | trim) | sha256sum) -}}
        {{- end -}}
        {{- include "prometheus-universal-exporter.metadataAnnotations" (list . $podAnnotations) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "prometheus-universal-exporter.serviceAccountName" . }}
      {{- /* The exporter never calls the Kubernetes API, so no token is
             mounted, whichever account the pod runs as: the default one
             included, with serviceAccount.create=false. */}}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with (include "prometheus-universal-exporter.terminationGracePeriodSeconds" .) }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      {{- /* A constraint without a labelSelector spreads this release's
             pods, as the Deployment selects them. */}}
      {{- $constraints := list }}
      {{- range . }}
      {{- $constraint := deepCopy . }}
      {{- if not (hasKey $constraint "labelSelector") }}
      {{- $_ := set $constraint "labelSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" (include "prometheus-universal-exporter.name" $) "app.kubernetes.io/instance" $.Release.Name)) }}
      {{- end }}
      {{- $constraints = append $constraints $constraint }}
      {{- end }}
      topologySpreadConstraints: {{- toYaml $constraints | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            {{- if $allocator }}
            {{- /* Allocator mode: the configuration and this pod's share of
                   the static targets come from the allocator, and no
                   configuration file is named. The pod is a member by its
                   name and is probed at its own address. */}}
            - {{ printf "--allocator.url=%s" (include "prometheus-universal-exporter.allocatorURL" .) | quote }}
            - {{ printf "--allocator.cache-dir=%s" (include "prometheus-universal-exporter.allocatorCacheDir" .) | quote }}
            - "--allocator.member=$(POD_NAME)"
            - {{ printf "--allocator.advertise=$(POD_IP):%d" (include "prometheus-universal-exporter.containerPort" . | int) | quote }}
            {{- if .Values.allocator.tokenSecret.name }}
            - {{ printf "--allocator.token-file=%s/token" (include "prometheus-universal-exporter.allocatorTokenDir" .) | quote }}
            {{- end }}
            {{- else }}
            - --config.file=/etc/prometheus-universal-exporter/config.yaml
            {{- end }}
            - {{ printf "--web.listen-address=%s" (include "prometheus-universal-exporter.listenAddress" .) | quote }}
            - {{ printf "--web.self-metrics-path=%s" .Values.selfMetrics.path | quote }}
            - {{ printf "--python.path=%s" (include "prometheus-universal-exporter.pythonPath" .) | quote }}
            {{- /* In allocator mode a new bundle reloads the configuration
                   itself. */}}
            {{- if and .Values.server.watchConfig (not $allocator) }}
            - --config.watch
            - {{ printf "--config.watch-interval=%s" (include "prometheus-universal-exporter.watchConfigInterval" .) | quote }}
            {{- end }}
            - {{ printf "--web.static-targets-path=%s" (include "prometheus-universal-exporter.staticTargetsPath" .) | quote }}
            {{- if .Values.staticTargets.enabled }}
            - {{ printf "--static-targets-file=%s/%s" (include "prometheus-universal-exporter.staticTargetsDir" .) (include "prometheus-universal-exporter.staticTargetsFile" .) | quote }}
            {{- if .Values.staticTargets.expandEnv }}
            - --static-targets.expand-env
            {{- end }}
            {{- end }}
            {{- /* In allocator mode the static target file is the bundle's,
                   which the pod reads, and expands, as it would its own. */}}
            {{- if and $allocator .Values.allocator.staticTargets.expandEnv }}
            - --static-targets.expand-env
            {{- end }}
            {{- if .Values.server.expandEnv }}
            - --config.expand-env
            {{- end }}
            - {{ printf "--log.level=%s" (include "prometheus-universal-exporter.logLevel" .) | quote }}
            {{- if .Values.server.enableLifecycle }}
            - --web.enable-lifecycle
            {{- end }}
            {{- with (include "prometheus-universal-exporter.debug" .) }}
            - {{ printf "--web.debug=%s" . | quote }}
            {{- end }}
            {{- with (include "prometheus-universal-exporter.probeTimeoutOffset" .) }}
            - {{ printf "--probe.timeout-offset=%s" . | quote }}
            {{- end }}
            {{- with (include "prometheus-universal-exporter.probeDefaultTimeout" .) }}
            - {{ printf "--probe.default-timeout=%s" . | quote }}
            {{- end }}
            {{- with (include "prometheus-universal-exporter.countFlag" (list "server.probeMaxConcurrent" .Values.server.probeMaxConcurrent)) }}
            - {{ printf "--probe.max-concurrent=%s" . | quote }}
            {{- end }}
            {{- with (include "prometheus-universal-exporter.countFlag" (list "server.pythonMaxWorkers" .Values.server.pythonMaxWorkers)) }}
            - {{ printf "--python.max-workers=%s" . | quote }}
            {{- end }}
            {{- with (include "prometheus-universal-exporter.memoryLimitRatio" .) }}
            - {{ printf "--runtime.memory-limit-ratio=%s" . | quote }}
            {{- end }}
            {{- with (include "prometheus-universal-exporter.shutdownTimeout" .) }}
            - {{ printf "--web.shutdown-timeout=%s" . | quote }}
            {{- end }}
            {{- with (include "prometheus-universal-exporter.shutdownDelay" .) }}
            - {{ printf "--web.shutdown-delay=%s" . | quote }}
            {{- end }}
            {{- include "prometheus-universal-exporter.extraArgs" . }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- /* GOGC from goGC.percent comes first, and is the only GOGC:
                 the helper refuses an env entry of that name beside it. */}}
          {{- $goGC := include "prometheus-universal-exporter.goGC" . }}
          {{- if or $goGC .Values.env $allocator }}
          env:
            {{- with $goGC }}
            - name: GOGC
              value: {{ . | quote }}
            {{- end }}
            {{- if $allocator }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ include "prometheus-universal-exporter.containerPort" . }}
              protocol: TCP
          livenessProbe:
            httpGet: {path: /health, port: http}
            {{- with .Values.livenessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            {{- with .Values.readinessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if $allocator }}
            - name: allocator-cache
              mountPath: {{ include "prometheus-universal-exporter.allocatorCacheDir" . }}
            {{- if .Values.allocator.tokenSecret.name }}
            - name: allocator-token
              mountPath: {{ include "prometheus-universal-exporter.allocatorTokenDir" . }}
              readOnly: true
            {{- end }}
            {{- else }}
            - name: config
              mountPath: /etc/prometheus-universal-exporter
              readOnly: true
            {{- end }}
            {{- if .Values.staticTargets.enabled }}
            - name: static-targets
              mountPath: {{ include "prometheus-universal-exporter.staticTargetsDir" . }}
              readOnly: true
            {{- end }}
            {{- if and .Values.targetAuth .Values.targetAuth.enabled }}
            - name: target-auth
              mountPath: {{ .Values.targetAuth.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if and .Values.webAuth .Values.webAuth.enabled }}
            - name: web-auth
              mountPath: {{ .Values.webAuth.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if and .Values.sshAuth .Values.sshAuth.enabled }}
            - name: ssh-auth
              mountPath: {{ .Values.sshAuth.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if and .Values.sqlAuth .Values.sqlAuth.enabled }}
            - name: sql-auth
              mountPath: {{ .Values.sqlAuth.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- include "prometheus-universal-exporter.validateMounts" . }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if $allocator }}
        - name: allocator-cache
          emptyDir: {}
        {{- with .Values.allocator.tokenSecret.name }}
        - name: allocator-token
          secret:
            secretName: {{ . | quote }}
            defaultMode: 256
            items:
              - key: {{ $.Values.allocator.tokenSecret.key | default "token" | quote }}
                path: token
        {{- end }}
        {{- else }}
        - name: config
          configMap:
            name: {{ include "prometheus-universal-exporter.fullname" . }}
        {{- end }}
        {{- if .Values.staticTargets.enabled }}
        - name: static-targets
          configMap:
            name: {{ include "prometheus-universal-exporter.staticTargetsName" . }}
        {{- end }}
        {{- if and .Values.targetAuth .Values.targetAuth.enabled }}
        - name: target-auth
          secret:
            secretName: {{ required "targetAuth.secretName is required when targetAuth.enabled is true" .Values.targetAuth.secretName | quote }}
            items:
              {{- if eq .Values.targetAuth.type "basic" }}
              - key: {{ .Values.targetAuth.usernameKey | quote }}
                path: {{ .Values.targetAuth.usernameFileName | quote }}
              - key: {{ .Values.targetAuth.passwordKey | quote }}
                path: {{ .Values.targetAuth.passwordFileName | quote }}
              {{- else }}
              - key: {{ .Values.targetAuth.secretKey | quote }}
                path: {{ .Values.targetAuth.fileName | quote }}
              {{- end }}
        {{- end }}
        {{- if and .Values.webAuth .Values.webAuth.enabled }}
        - name: web-auth
          secret:
            secretName: {{ required "webAuth.secretName is required when webAuth.enabled is true" .Values.webAuth.secretName | quote }}
            items:
              - key: {{ .Values.webAuth.usernameKey | quote }}
                path: username
              - key: {{ .Values.webAuth.passwordKey | quote }}
                path: password
        {{- end }}
        {{- if and .Values.sshAuth .Values.sshAuth.enabled }}
        {{- /* One directory of fixed file names, whichever source each comes
               from. Mode 0400 (256): the kubelet makes the files group-owned
               by podSecurityContext.fsGroup and adds the group's read bit, so
               the exporter, of that group, reads them and no other user
               does. */}}
        - name: ssh-auth
          projected:
            defaultMode: 256
            sources:
              - secret:
                  name: {{ .Values.sshAuth.secretName | quote }}
                  items:
                    {{- with .Values.sshAuth.privateKeyKey }}
                    - key: {{ . | quote }}
                      path: private_key
                    {{- end }}
                    {{- with .Values.sshAuth.passphraseKey }}
                    - key: {{ . | quote }}
                      path: passphrase
                    {{- end }}
                    {{- with .Values.sshAuth.passwordKey }}
                    - key: {{ . | quote }}
                      path: password
                    {{- end }}
                    {{- with .Values.sshAuth.knownHostsSecretKey }}
                    - key: {{ . | quote }}
                      path: known_hosts
                    {{- end }}
              {{- if .Values.sshAuth.knownHosts }}
              - configMap:
                  name: {{ include "prometheus-universal-exporter.sshKnownHostsName" . | quote }}
                  items:
                    - key: known_hosts
                      path: known_hosts
              {{- end }}
        {{- end }}
        {{- if and .Values.sqlAuth .Values.sqlAuth.enabled }}
        {{- /* Fixed file names, mode 0400 (256) as sshAuth's: readable by
               the exporter through podSecurityContext.fsGroup alone. */}}
        - name: sql-auth
          secret:
            secretName: {{ .Values.sqlAuth.secretName | quote }}
            defaultMode: 256
            items:
              {{- range $item := list (list "passwordKey" "password") (list "privateKeyKey" "private_key") (list "caKey" "ca.crt") (list "certKey" "client.crt") (list "keyKey" "client.key") }}
              {{- with index $.Values.sqlAuth (first $item) }}
              - key: {{ . | quote }}
                path: {{ last $item | quote }}
              {{- end }}
              {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
