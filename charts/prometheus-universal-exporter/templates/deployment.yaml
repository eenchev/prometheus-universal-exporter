{{- include "prometheus-universal-exporter.validateTargets" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prometheus-universal-exporter.fullname" . }}
  {{ with .Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.metadataLabels" (list .) | nindent 4 }}
  annotations:
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list .) | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "prometheus-universal-exporter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "prometheus-universal-exporter.metadataLabels" (list .) | nindent 8 }}
      annotations:
        {{- $podAnnotations := dict "checksum/config" (include (print $.Template.BasePath "/configmap.yaml") . | sha256sum) -}}
        {{- include "prometheus-universal-exporter.metadataAnnotations" (list . $podAnnotations) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "prometheus-universal-exporter.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --config.file=/etc/prometheus-universal-exporter/config.yaml
            - {{ printf "--web.listen-address=%s" (include "prometheus-universal-exporter.listenAddress" .) | quote }}
            - {{ printf "--web.self-metrics-path=%s" .Values.selfMetrics.path | quote }}
            - {{ printf "--python.path=%s" (include "prometheus-universal-exporter.pythonPath" .) | quote }}
            {{- if .Values.otlpTargets.enabled }}
            - {{ printf "--otlp.targets-file=/etc/prometheus-universal-exporter/%s" (include "prometheus-universal-exporter.targetsFile" .) | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ include "prometheus-universal-exporter.containerPort" . }}
              protocol: TCP
          livenessProbe:
            httpGet: {path: /health, port: http}
          readinessProbe:
            httpGet: {path: /ready, port: http}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus-universal-exporter
              readOnly: true
            {{- if and .Values.targetAuth .Values.targetAuth.enabled }}
            - name: target-auth
              mountPath: {{ .Values.targetAuth.mountPath | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "prometheus-universal-exporter.fullname" . }}
        {{- if and .Values.targetAuth .Values.targetAuth.enabled }}
        - name: target-auth
          secret:
            secretName: {{ required "targetAuth.secretName is required when targetAuth.enabled is true" .Values.targetAuth.secretName | quote }}
            items:
              {{- if eq .Values.targetAuth.type "basic" }}
              - key: {{ .Values.targetAuth.usernameKey | quote }}
                path: {{ .Values.targetAuth.usernameFileName | quote }}
              - key: {{ .Values.targetAuth.passwordKey | quote }}
                path: {{ .Values.targetAuth.passwordFileName | quote }}
              {{- else }}
              - key: {{ .Values.targetAuth.secretKey | quote }}
                path: {{ .Values.targetAuth.fileName | quote }}
              {{- end }}
        {{- end }}
