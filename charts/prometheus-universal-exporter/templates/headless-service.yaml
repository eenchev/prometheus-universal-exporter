{{- if eq (include "prometheus-universal-exporter.workloadKind" .) "StatefulSet" }}
{{- /* The Service a StatefulSet names as its serviceName. It carries no
       app.kubernetes.io/name, so the monitors, which select the exporter's
       Service by it, do not scrape every pod a second time through this
       one. */}}
{{- $labels := include "prometheus-universal-exporter.metadataLabels" (list .) | fromYaml }}
{{- $_ := unset $labels "app.kubernetes.io/name" }}
{{- $_ := set $labels "app.kubernetes.io/component" "headless" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prometheus-universal-exporter.headlessName" . }}
  {{ with .Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  annotations:
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list .) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "prometheus-universal-exporter.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ include "prometheus-universal-exporter.containerPort" . }}
      targetPort: http
      protocol: TCP
{{- end }}
