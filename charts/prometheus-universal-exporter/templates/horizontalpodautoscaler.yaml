{{- if .Values.autoscaling.enabled }}
{{- $scaling := .Values.autoscaling }}
{{- $minReplicas := include "prometheus-universal-exporter.wholeNumber" (list "autoscaling.minReplicas" $scaling.minReplicas 1 2147483647) }}
{{- $maxReplicas := include "prometheus-universal-exporter.wholeNumber" (list "autoscaling.maxReplicas" $scaling.maxReplicas 1 2147483647) }}
{{- if lt (int64 $maxReplicas) (int64 $minReplicas) }}
{{- fail (printf "autoscaling.maxReplicas %s is below autoscaling.minReplicas %s" ($maxReplicas | default "<nil>") ($minReplicas | default "<nil>")) }}
{{- end }}
{{- $busy := include "prometheus-universal-exporter.averageValue" (list "autoscaling.targetBusy" $scaling.targetBusy) }}
{{- $perPod := include "prometheus-universal-exporter.wholeNumber" (list "autoscaling.targetStaticTargetsPerPod" $scaling.targetStaticTargetsPerPod 1 2147483647) }}
{{- /* Without the allocator every pod scrapes every static target, so the
       average per pod stays the whole count however many pods there are,
       and the autoscaler would only ever scale up. */}}
{{- if and $perPod (not (and .Values.allocator .Values.allocator.enabled)) }}
{{- fail "autoscaling.targetStaticTargetsPerPod is set without allocator.enabled, but without the allocator every pod scrapes every static target, so the static targets per pod do not fall as pods are added; scale on targetBusy, or enable the allocator, which splits the static targets over the pods" }}
{{- end }}
{{- if and $busy (not $scaling.busyMetric) }}
{{- fail "autoscaling.targetBusy is set, but autoscaling.busyMetric, the name the metrics adapter serves the metric under, is empty" }}
{{- end }}
{{- if and $perPod (not $scaling.staticTargetsMetric) }}
{{- fail "autoscaling.targetStaticTargetsPerPod is set, but autoscaling.staticTargetsMetric, the name the metrics adapter serves the metric under, is empty" }}
{{- end }}
{{- if and (not $scaling.targetCPUUtilizationPercentage) (not $scaling.targetMemoryUtilizationPercentage) (not $busy) (not $perPod) (not $scaling.metrics) }}
{{- fail "autoscaling.enabled needs something to scale on: targetCPUUtilizationPercentage, targetMemoryUtilizationPercentage, targetBusy, targetStaticTargetsPerPod or metrics" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "prometheus-universal-exporter.fullname" . }}
  {{ with .Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.metadataLabels" (list .) | nindent 4 }}
  annotations:
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list .) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "prometheus-universal-exporter.fullname" . }}
  minReplicas: {{ $minReplicas }}
  maxReplicas: {{ $maxReplicas }}
  metrics:
    {{- with $scaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ include "prometheus-universal-exporter.wholeNumber" (list "autoscaling.targetCPUUtilizationPercentage" . 1 2147483647) }}
    {{- end }}
    {{- with $scaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ include "prometheus-universal-exporter.wholeNumber" (list "autoscaling.targetMemoryUtilizationPercentage" . 1 2147483647) }}
    {{- end }}
    {{- if $busy }}
    - type: Pods
      pods:
        metric:
          name: {{ $scaling.busyMetric | toString | quote }}
        target:
          type: AverageValue
          averageValue: {{ $busy | quote }}
    {{- end }}
    {{- if $perPod }}
    - type: Pods
      pods:
        metric:
          name: {{ $scaling.staticTargetsMetric | toString | quote }}
        target:
          type: AverageValue
          averageValue: {{ $perPod | quote }}
    {{- end }}
    {{- with $scaling.metrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $scaling.behavior }}
  behavior: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
