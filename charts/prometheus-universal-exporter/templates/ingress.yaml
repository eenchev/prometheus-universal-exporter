{{- if .Values.ingress.enabled }}
{{- /* The Ingress routes to the exporter's Service; without it every request
       through the Ingress is answered 503 by the controller. */}}
{{- if not .Values.service.enabled }}
{{- fail "ingress.enabled routes to the exporter's Service, which service.enabled=false leaves out; enable the Service or disable the Ingress" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "prometheus-universal-exporter.fullname" . }}
  {{ with .Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.metadataLabels" (list .) | nindent 4 }}
  annotations:
    {{- $annotations := .Values.ingress.annotations | default dict -}}
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list . $annotations) | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "prometheus-universal-exporter.fullname" $ }}
                port:
                  number: {{ include "prometheus-universal-exporter.servicePort" $ }}
          {{- end }}
    {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
