{{- $root := . }}
{{- include "prometheus-universal-exporter.requireServiceForProbes" . }}
{{- range $index, $monitor := .Values.monitors }}
{{- if and $monitor.enabled (eq $monitor.type "pod") }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "prometheus-universal-exporter.fullname" $root }}-{{ $monitor.name }}
  {{ with $root.Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.metadataLabels" (list $root $monitor.labels) | nindent 4 }}
  annotations:
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list $root $monitor.annotations) | nindent 4 }}
spec:
  {{- /* Without a namespaceSelector the Prometheus Operator looks for targets
         in the monitor's own namespace only; with one, in the namespaces it
         names, or in all of them. */}}
  {{- with $monitor.namespaceSelector }}
  namespaceSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- /* Each action trims the newline before it and starts its own line,
           so the selector's keys always land beneath selector:. */}}
    {{- if $monitor.targetSelector }}
    {{- toYaml $monitor.targetSelector | nindent 4 }}
    {{- else }}
    matchLabels:
      app.kubernetes.io/name: target
    {{- end }}
  podMetricsEndpoints:
    {{- /* The name of the selected pods' container port whose address becomes
           the probe's target: http unless the entry says otherwise. The
           helper refuses what is not a port's name, a port number first. */}}
    - port: {{ include "prometheus-universal-exporter.monitorPort" $monitor | quote }}
      path: /probe
      {{- /* Left out when unset, so the Prometheus Operator's defaults apply,
             rather than rendered as null. */}}
      {{- with $monitor.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with $monitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      params:
        collector: [{{ $monitor.collector | quote }}]
        {{ range $name, $value := $monitor.headers }}
        header_{{ $name }}: [{{ $value | quote }}]
        {{ end }}
        {{ range $name, $values := $monitor.params }}
        {{ $name }}: {{ toYaml $values | nindent 10 }}
        {{ end }}
      {{- with (include "prometheus-universal-exporter.monitorAuth" (list $root $monitor)) }}
      {{- . | nindent 6 }}
      {{- end }}
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: __param_target
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: {{ include "prometheus-universal-exporter.serviceAddress" $root }}
      {{- with $monitor.relabelings }}
      {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $monitor.metricRelabelings }}
      metricRelabelings:
        {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- if eq (include "prometheus-universal-exporter.selfMonitor" .) "PodMonitor" }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "prometheus-universal-exporter.fullname" . }}-self
  {{ with .Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.metadataLabels" (list . .Values.selfMetrics.labels) | nindent 4 }}
  annotations:
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list . .Values.selfMetrics.annotations) | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "prometheus-universal-exporter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  podMetricsEndpoints:
    - port: http
      path: {{ .Values.selfMetrics.path | quote }}
      interval: {{ .Values.selfMetrics.interval }}
      scrapeTimeout: {{ .Values.selfMetrics.scrapeTimeout }}
      {{- if and .Values.webAuth .Values.webAuth.enabled }}
      {{- /* The exporter's own Basic Auth protects this endpoint too. */}}
      basicAuth:
        username:
          name: {{ .Values.webAuth.secretName | quote }}
          key: {{ .Values.webAuth.usernameKey | quote }}
        password:
          name: {{ .Values.webAuth.secretName | quote }}
          key: {{ .Values.webAuth.passwordKey | quote }}
      {{- end }}
      {{- with .Values.selfMetrics.relabelings }}
      relabelings:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.selfMetrics.metricRelabelings }}
      metricRelabelings:
        {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
