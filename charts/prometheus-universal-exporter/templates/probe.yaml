{{- include "prometheus-universal-exporter.requireBlocks" . -}}
{{- /* A Prometheus Operator Probe per probes entry, as blackbox_exporter is
       declared: the Prometheus Operator turns each target, a static URL or
       an Ingress it selects, into the target parameter and the instance
       label, and sends the scrape to the prober, the exporter's Service, at
       /probe. The collector travels as a parameter of spec.params, never as
       spec.module, which the Prometheus Operator sends as module=. */ -}}
{{- $root := . }}
{{- include "prometheus-universal-exporter.requireServiceForProbes" . }}
{{- range $probe := .Values.probes }}
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: {{ include "prometheus-universal-exporter.fullname" $root }}-{{ $probe.name }}
  {{ with $root.Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.metadataLabels" (list $root $probe.labels) | nindent 4 }}
  annotations:
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list $root $probe.annotations) | nindent 4 }}
spec:
  {{- with $probe.jobName }}
  jobName: {{ . | quote }}
  {{- end }}
  prober:
    url: {{ include "prometheus-universal-exporter.serviceAddress" $root | quote }}
    scheme: http
    path: /probe
  {{- /* Left out when unset, so Prometheus's defaults apply. */}}
  {{- with $probe.interval }}
  interval: {{ . }}
  {{- end }}
  {{- with $probe.scrapeTimeout }}
  scrapeTimeout: {{ . }}
  {{- end }}
  params:
    - name: collector
      values: [{{ $probe.collector | quote }}]
    {{- range $name, $values := $probe.params }}
    - name: {{ $name | quote }}
      values:
        {{- toYaml $values | nindent 8 }}
    {{- end }}
  {{- /* The entry's own credential, or the webAuth Secret's, as a probe
         monitor presents it: the Probe takes both in the same fields. */}}
  {{- with (include "prometheus-universal-exporter.monitorAuth" (list $root $probe "probes")) }}
  {{- . | nindent 2 }}
  {{- end }}
  targets:
    {{- if $probe.targets }}
    staticConfig:
      static:
        {{- toYaml $probe.targets | nindent 8 }}
      {{- with $probe.targetLabels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $probe.relabelings }}
      relabelingConfigs:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- else }}
    {{- /* An entry with neither is refused while the Deployment renders;
           a default here keeps this template from failing first, on a nil
           ingress, with a message that says nothing of why. */}}
    {{- $ingress := $probe.ingress | default dict }}
    ingress:
      selector:
        {{- toYaml ($ingress.selector | default dict) | nindent 8 }}
      {{- with $ingress.namespaceSelector }}
      namespaceSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $probe.relabelings }}
      relabelingConfigs:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- with $probe.metricRelabelings }}
  metricRelabelings:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
