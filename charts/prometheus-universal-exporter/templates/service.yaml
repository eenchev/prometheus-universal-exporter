{{- if .Values.service.enabled }}
{{- /* NodePort and LoadBalancer open the exporter to whoever reaches a node's
       port or the load balancer's address. */}}
{{- if has .Values.service.type (list "NodePort" "LoadBalancer") }}
{{- include "prometheus-universal-exporter.requireAuthForExposure" (list . (printf "service.type=%s" .Values.service.type)) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prometheus-universal-exporter.fullname" . }}
  {{ with .Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.metadataLabels" (list .) | nindent 4 }}
  annotations:
    {{- $annotations := .Values.service.annotations | default dict -}}
    {{- if .Values.neg.enabled }}
    {{- $_ := set $annotations "cloud.google.com/neg" "{\"ingress\": true}" -}}
    {{- range $key, $value := .Values.neg.annotations }}{{- $_ := set $annotations $key $value -}}{{- end }}
    {{- end }}
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list . $annotations) | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "prometheus-universal-exporter.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ include "prometheus-universal-exporter.servicePort" . }}
      targetPort: http
      protocol: TCP
{{- end }}
