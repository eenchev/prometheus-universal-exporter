{{- $root := . }}
{{- range $index, $monitor := .Values.monitors }}
{{- if and $monitor.enabled (eq $monitor.type "service") }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ if $monitor.name }}{{ include "prometheus-universal-exporter.fullname" $root }}-{{ $monitor.name }}{{ else }}{{ include "prometheus-universal-exporter.fullname" $root }}-monitor-{{ $index }}{{ end }}
  {{ with $root.Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.metadataLabels" (list $root $monitor.labels) | nindent 4 }}
  annotations:
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list $root $monitor.annotations) | nindent 4 }}
spec:
  selector:
    {{- if $monitor.targetSelector }}{{ toYaml $monitor.targetSelector | nindent 4 }}{{ else }}matchLabels:
      app.kubernetes.io/name: target
    {{- end }}
  endpoints:
    - port: http
      path: /probe
      interval: {{ $monitor.interval }}
      scrapeTimeout: {{ $monitor.scrapeTimeout }}
      params:
        collector: [{{ $monitor.collector | quote }}]
        {{ range $name, $value := $monitor.headers }}
        header_{{ $name }}: [{{ $value | quote }}]
        {{ end }}
        {{ range $name, $values := $monitor.params }}
        {{ $name }}: {{ toYaml $values | nindent 10 }}
        {{ end }}
      {{ if and $monitor.auth $monitor.auth.enabled (eq $monitor.auth.type "bearer") }}
      authorization:
        type: Bearer
        credentials:
          name: {{ $monitor.auth.secretName | quote }}
          key: {{ $monitor.auth.secretKey | default "token" | quote }}
          optional: {{ $monitor.auth.optional | default false }}
      {{ else if and $monitor.auth $monitor.auth.enabled (eq $monitor.auth.type "basic") }}
      basicAuth:
        username:
          name: {{ $monitor.auth.secretName | quote }}
          key: {{ $monitor.auth.usernameKey | default "username" | quote }}
          optional: {{ $monitor.auth.optional | default false }}
        password:
          name: {{ $monitor.auth.secretName | quote }}
          key: {{ $monitor.auth.passwordKey | default "password" | quote }}
          optional: {{ $monitor.auth.optional | default false }}
      {{ end }}
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: __param_target
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: {{ include "prometheus-universal-exporter.fullname" $root }}:{{ $root.Values.service.port }}
      {{- with $monitor.relabelings }}
      {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $monitor.metricRelabelings }}
      metricRelabelings:
        {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- $hasServiceMonitor := false }}
{{- range .Values.monitors }}{{- if and .enabled (eq .type "service") }}{{- $hasServiceMonitor = true }}{{- end }}{{- end }}
{{- if and .Values.selfMetrics.enabled $hasServiceMonitor }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "prometheus-universal-exporter.fullname" . }}-self
  {{ with .Values.namespaceOverride }}namespace: {{ . }}{{ end }}
  labels:
    {{- include "prometheus-universal-exporter.metadataLabels" (list . .Values.selfMetrics.labels) | nindent 4 }}
  annotations:
    {{- include "prometheus-universal-exporter.metadataAnnotations" (list . .Values.selfMetrics.annotations) | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "prometheus-universal-exporter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: {{ .Values.selfMetrics.path | quote }}
      interval: {{ .Values.selfMetrics.interval }}
      scrapeTimeout: {{ .Values.selfMetrics.scrapeTimeout }}
      {{- if and .Values.webAuth .Values.webAuth.enabled }}
      {{- /* The exporter's own Basic Auth protects this endpoint too. */}}
      basicAuth:
        username:
          name: {{ .Values.webAuth.secretName | quote }}
          key: {{ .Values.webAuth.usernameKey | quote }}
        password:
          name: {{ .Values.webAuth.secretName | quote }}
          key: {{ .Values.webAuth.passwordKey | quote }}
      {{- end }}
      {{- with .Values.selfMetrics.relabelings }}
      relabelings:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.selfMetrics.metricRelabelings }}
      metricRelabelings:
        {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
