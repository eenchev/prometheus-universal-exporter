replicaCount: 1
namespaceOverride: ""
nameOverride: ""
fullnameOverride: ""
defaultLabels: {}
defaultAnnotations: {}
image:
  repository: ghcr.io/evgenienchev/prometheus-universal-exporter
  tag: "latest"
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
service:
  enabled: true
  type: ClusterIP
  port: 8080
  annotations: {}
neg:
  enabled: false
  annotations: {}
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: exporter.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
config:
  enabled: true
  data:
    config.yaml: |
      collectors:
        - name: example
          request:
            path: /status
          response:
            format: text
          transform:
            type: regex
          metrics:
            - name: example_status
              description: Example status value
              type: gauge
              expression: 'status:\s+(\d+(?:\.\d+)?)'
monitors: []
# Example:
# monitors:
#   - name: application-services
#     enabled: true
#     type: service # service or pod
#     interval: 30s
#     scrapeTimeout: 10s
#     labels: {}
#     annotations: {}
#     targetSelector: {}
#     collector: example
#     relabelings: []
#     metricRelabelings: []
#     headers: {}
#     # Optional /probe request parameter overrides. Values must be lists.
#     params:
#       method: [POST]
#       path: [/api/status]
#       timeout: [5s]
#       body: [raw request body]
#     auth:
#       enabled: false
#       type: bearer # bearer or basic
#       secretName: ""
#       secretKey: token
#       usernameKey: username
#       passwordKey: password
#       optional: false
selfMetrics:
  path: /self-metrics
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}
  relabelings: []
  metricRelabelings: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
nodeSelector: {}
tolerations: []
affinity: {}
networkPolicy:
  enabled: false
  ingress: []
  egress: []
targetAuth:
  enabled: false
  type: bearer # bearer or basic
  secretName: ""
  secretKey: token
  fileName: token
  usernameKey: username
  passwordKey: password
  mountPath: /var/run/prometheus-universal-exporter/target-auth
  usernameFileName: username
  passwordFileName: password
# For basic auth from a Secret, set enabled: true and type: basic, then
# reference the mounted files from a collector:
# request:
#   basic_auth_file:
#     username: /var/run/prometheus-universal-exporter/target-auth/username
#     password: /var/run/prometheus-universal-exporter/target-auth/password
