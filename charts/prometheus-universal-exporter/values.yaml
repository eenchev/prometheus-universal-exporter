replicaCount: 1
namespaceOverride: ""
nameOverride: ""
fullnameOverride: ""
defaultLabels: {}
defaultAnnotations: {}
image:
  repository: ghcr.io/eenchev/prometheus-universal-exporter
  tag: "latest"
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
service:
  enabled: true
  type: ClusterIP
  port: 8080
  annotations: {}
neg:
  enabled: false
  annotations: {}
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: exporter.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
# Exporter process settings. These become command-line flags on the container.
server:
  # Address the exporter listens on. The container port follows the port in
  # this value; Service, Ingress, and monitor references use the named port, so
  # they follow automatically. Must be host:port — an empty host, a name, an
  # IPv4 address, or a bracketed IPv6 address, then a colon and a TCP port.
  # A bare port such as "9115" is rejected while rendering, because Go would
  # otherwise accept the flag and fail to listen with "missing port in address".
  listenAddress: ":8080"
  # Python interpreter used by the `python` transform. The default is the
  # interpreter path in the exporter image, which is based on python:3.X-slim.
  # Override this when running a custom image with Python installed elsewhere.
  pythonPath: /usr/local/bin/python3
  # Re-read the configuration when it changes on disk, without restarting.
  # Off by default: with a chart-managed ConfigMap the checksum annotation
  # already rolls the Deployment on every change, so the pod restarts with the
  # new configuration and an in-place reload never gets a chance. Turn this on
  # when config.enabled is false and an external ConfigMap is updated without a
  # rollout.
  watchConfig: false
  # How often to re-check the files when watchConfig is true. Must be positive.
  watchConfigInterval: 60s
  # Expand ${NAME} environment variable references in the configuration and
  # its collector files (--config.expand-env), so a value can come from a
  # Secret rather than from the committed file. The static target document has
  # its own switch, staticTargets.expandEnv. Off by default, because a configuration is full of
  # dollar signs that are not references — a regex, a jq expression, a Python
  # pre-script — and only ${NAME} is substituted. A reference whose variable is
  # not set stops the exporter at startup rather than becoming an empty string.
  # Set the variables through `env` or `envFrom` below.
  expandEnv: false
  # Log level of the exporter: debug, info, warn or error. Logs are JSON lines
  # on stderr.
  logLevel: info
  # How much of Prometheus's scrape timeout (the monitor's scrapeTimeout) a
  # probe leaves unused, so it can answer with its own error, such as a slow
  # target or a hung file read, before Prometheus gives up. A Go duration of
  # zero or more; empty keeps the exporter's default, 500ms, and leaves the flag
  # out, so the chart also works with exporter images that predate it. Raise it
  # if Prometheus still times out first.
  probeTimeoutOffset: ""
  # How long a probe may take when it names no deadline: no scrape timeout
  # header and no timeout parameter, as from curl or a script. Prometheus
  # always sends one, so this does not change its scrapes. A Go duration of
  # zero or more, 0 leaving such a probe unbounded; empty keeps the exporter's
  # default, 30s, and leaves the flag out.
  probeDefaultTimeout: ""
  # Enable POST /-/reload, which reloads the configuration at once and answers
  # whether it was accepted, for tools that update the configuration without
  # a rollout. Off by default; with a chart-managed ConfigMap a change rolls
  # the Deployment anyway. The endpoint is behind web.basic_auth when that is
  # configured. SIGHUP reloads whether or not this is set.
  enableLifecycle: false
  # How long a pod that is stopping waits for the probes in progress before
  # closing their connections: hours, minutes and seconds such as "30s" or
  # "1m30s". Keep it at least as long as the monitors' scrapeTimeout, or a
  # rollout cuts probes off and Prometheus records them as failed scrapes.
  # Empty keeps the exporter's default, 5s, and leaves the flag out, so the
  # chart also works with exporter images that predate it. The pod's
  # terminationGracePeriodSeconds is raised to cover it (see below).
  shutdownTimeout: ""
  # How long a pod that is stopping keeps serving probes, with /ready
  # answering 503, before the graceful shutdown above begins. Kubernetes takes
  # a few seconds to take a terminating pod out of the Service; without the
  # delay, probes arriving in that gap are refused and Prometheus records
  # failed scrapes during every rollout. Whole hours, minutes and seconds;
  # "0s" turns the delay off. Empty leaves the flag out, for exporter images
  # that predate it. Counted in terminationGracePeriodSeconds (see below).
  shutdownDelay: 5s

# Environment variables for the exporter container, in the Kubernetes shapes.
# These are what server.expandEnv substitutes from; they are also useful on
# their own, for anything the image reads from the environment, such as
# HTTPS_PROXY, HTTP_PROXY and NO_PROXY, which target requests and OTLP exports
# go through.
#
#   env:
#     - name: DEMO_TARGET
#       value: http://api.internal:8080
#     - name: API_TOKEN
#       valueFrom:
#         secretKeyRef:
#           name: exporter-secrets
#           key: api-token
env: []

#   envFrom:
#     - secretRef:
#         name: exporter-secrets
envFrom: []

# Extra command-line flags for the exporter, on top of the ones the chart
# renders from the values above. Every flag the exporter has today is a value
# under server (or selfMetrics.path, staticTargets), so this is for a flag an
# exporter image has that this chart version does not know yet. Each entry is a
# whole argument:
#
#   extraArgs:
#     - --some.new-flag=value
#
# A flag the chart already manages is rejected while rendering rather than
# silently overriding the value it came from — Go keeps the last occurrence of a
# flag, so `--web.listen-address` here would move the listener while the
# container port and the probes stayed on server.listenAddress. So is a flag
# that prints something and exits, such as --dry-run or --config.schema, which
# would restart the pod for ever.
extraArgs: []

# Extra volumes and mounts, in the ordinary Kubernetes shapes. This is how to
# mount a ConfigMap or Secret the chart does not create — an extra collector
# configuration, a CA bundle, a credential file:
#
#   extraVolumes:
#     - name: extra-collectors
#       configMap:
#         name: my-collectors
#     - name: internal-ca
#       secret:
#         secretName: internal-ca
#
#   extraVolumeMounts:
#     - name: extra-collectors
#       mountPath: /etc/collectors
#       readOnly: true
#     - name: internal-ca
#       mountPath: /etc/ssl/internal
#       readOnly: true
#
# A mount path the chart already uses is rejected while rendering: mounting over
# the configuration directory would hide config.yaml and crash-loop the pod.
extraVolumes: []
extraVolumeMounts: []

# Static targets, scraped by the exporter itself on their own intervals and
# served together at path for Prometheus to scrape, through the monitor below.
# A target with export_via_otlp: true is also delivered over OTLP, which needs
# otlp.enabled in the configuration; when the chart manages the configuration,
# rendering fails early rather than the pod.
staticTargets:
  enabled: false
  # File name inside the mounted configuration directory: its key in the
  # configuration ConfigMap, so letters, digits, -, _ and ., and not a key
  # config.data already uses.
  fileName: static-targets.yaml
  # Rendered as --web.static-targets-path: where the targets' latest results
  # are served. A path of plain segments that is not selfMetrics.path.
  path: /static-targets
  # Expand ${NAME} environment variable references in the static target
  # document (--static-targets.expand-env), so an address or a credential can
  # come from a Secret through `env` or `envFrom`. Independent of
  # server.expandEnv, and rendered only with staticTargets.enabled. As there,
  # only ${NAME} is substituted, $$ writes a literal dollar, and an unset
  # variable stops the exporter at startup.
  expandEnv: false
  # The static target document. Rendered into the exporter ConfigMap, so a
  # change to it rolls the Deployment through the existing checksum annotation.
  # Required with config.enabled. With config.enabled: false the chart renders
  # no ConfigMap: put the file into your own under fileName, and leave this
  # empty, or rendering fails rather than dropping it.
  data: ""
  # Example:
  # data: |
  #   interval: 1m
  #   targets:
  #     - name: legacy_eu
  #       collector: legacy_text
  #       target: http://legacy.eu.example:8080
  #       request:
  #         path: /status
  #         timeout: 5s
  # The ServiceMonitor (type: service) or PodMonitor (type: pod) that scrapes
  # the static targets endpoint, rendered when staticTargets.enabled is. It
  # needs the Prometheus Operator's CRDs; set enabled: false without them.
  # interval is how often Prometheus reads the targets' latest results, not
  # how often the exporter scrapes them, which the document's intervals say.
  monitor:
    enabled: true
    type: service
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
    relabelings: []
    metricRelabelings: []
    # Names of the static targets this monitor reads, rendered as the
    # endpoint's ?targets= parameter; empty reads every target. Each must be
    # a target in staticTargets.data, or rendering fails. To read groups of
    # targets on different intervals, add a monitor of your own per group.
    targets: []
  #       labels:
  #         region: eu
  #       otlp:
  #         service_name: legacy-app
  #         resource_attributes:
  #           deployment.environment: production

# The exporter configuration, rendered into the exporter ConfigMap. Every key of
# data becomes a file next to config.yaml, so collector files can be added as
# keys and listed under collector_files, relative to config.yaml. A collector
# name must be unique across config.yaml and every collector file:
#
#   data:
#     config.yaml: |
#       collector_files:
#         - collectors-*.yaml
#     collectors-payments.yaml: |
#       collectors:
#         - name: payments_api
#           ...
config:
  enabled: true
  data:
    config.yaml: |
      collectors:
        - name: example
          request:
            type: http
            path: /status
          transform:
            type: regex
          metrics:
            - name: example_status
              description: Example status value
              type: gauge
              error_mode: log
              labels: []
              expression: 'status:\s+(\d+(?:\.\d+)?)'
monitors: []
# Example:
# monitors:
#   - name: application-services
#     enabled: true
#     type: service # service or pod
#     interval: 30s
#     scrapeTimeout: 10s
#     labels: {}
#     annotations: {}
#     targetSelector: {}
#     collector: example
#     relabelings: []
#     metricRelabelings: []
#     headers: {}
#     # Optional /probe request parameter overrides. Values must be lists.
#     params:
#       method: [POST]
#       path: [/api/status]
#       timeout: [5s]
#       body: [raw request body]
#       follow_redirects: ["true"]
#       enable_http2: ["true"]
#     auth:
#       enabled: false
#       type: bearer # bearer or basic
#       secretName: ""
#       secretKey: token
#       usernameKey: username
#       passwordKey: password
#       optional: false
# The self-metrics ServiceMonitor/PodMonitor. What that endpoint publishes is
# configured in the exporter configuration rather than here: set
# web.self_metrics.verbose for the per-request series, the per-collector
# scrape-time histograms and the Python worker metrics, and
# web.self_metrics.resource_metrics_enabled for the go_ and process_ series
# describing the exporter's own CPU and memory.
selfMetrics:
  path: /self-metrics
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}
  relabelings: []
  metricRelabelings: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
# How long Kubernetes lets a stopping pod run before killing it. Empty leaves
# Kubernetes' default, 30 seconds, unless the shutdown needs more: the chart
# then renders server.shutdownDelay plus server.shutdownTimeout plus 10
# seconds, the 10 for the exporter's last OTLP export and exit. Set explicitly, it must be at
# least that, or rendering fails.
terminationGracePeriodSeconds: null
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
nodeSelector: {}
tolerations: []
affinity: {}
networkPolicy:
  enabled: false
  ingress: []
  egress: []
targetAuth:
  enabled: false
  type: bearer # bearer or basic
  secretName: ""
  secretKey: token
  fileName: token
  usernameKey: username
  passwordKey: password
  mountPath: /var/run/prometheus-universal-exporter/target-auth
  usernameFileName: username
  passwordFileName: password
# For basic auth from a Secret, set enabled: true and type: basic, then
# reference the mounted files from a collector:
# request:
#   basic_auth_file:
#     username: /var/run/prometheus-universal-exporter/target-auth/username
#     password: /var/run/prometheus-universal-exporter/target-auth/password

# The exporter's own Basic Auth credential (web.basic_auth) from a Secret, so
# the password stays out of the configuration's ConfigMap. The Secret's
# username and password keys are mounted as files named username and password
# under mountPath; point the configuration at them:
#
#   web:
#     basic_auth:
#       enabled: true
#       username_file: /var/run/prometheus-universal-exporter/web-auth/username
#       password_file: /var/run/prometheus-universal-exporter/web-auth/password
#
# The self-metrics monitor uses this Secret by itself. The same Secret can give
# the probing monitors their credential: set a monitor's auth to type basic
# with this secretName. A rotated Secret is picked up by
# the exporter's next request, without a restart.
webAuth:
  enabled: false
  secretName: ""
  usernameKey: username
  passwordKey: password
  mountPath: /var/run/prometheus-universal-exporter/web-auth
