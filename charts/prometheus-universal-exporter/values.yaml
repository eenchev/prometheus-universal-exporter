replicaCount: 1
namespaceOverride: ""
nameOverride: ""
fullnameOverride: ""
defaultLabels: {}
defaultAnnotations: {}
image:
  repository: ghcr.io/evgenienchev/prometheus-universal-exporter
  tag: "latest"
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
service:
  enabled: true
  type: ClusterIP
  port: 8080
  annotations: {}
neg:
  enabled: false
  annotations: {}
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: exporter.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
# Exporter process settings. These become command-line flags on the container.
server:
  # Address the exporter listens on. The container port follows the port in
  # this value; Service, Ingress, and monitor references use the named port, so
  # they follow automatically. Must end in a valid TCP port.
  listenAddress: ":8080"
  # Python interpreter used by the `python` transform. The default is the
  # interpreter path in the exporter image, which is based on python:3.X-slim.
  # Override this when running a custom image with Python installed elsewhere.
  pythonPath: /usr/local/bin/python3

# Scheduled targets scraped by the exporter itself and delivered over OTLP.
# The exporter refuses to start with these while OTLP export is disabled, so
# when the chart manages the configuration `helm template` fails early instead.
otlpTargets:
  enabled: false
  # File name inside the mounted configuration directory.
  fileName: targets.yaml
  # The scheduled target document. Rendered into the exporter ConfigMap, so a
  # change to it rolls the Deployment through the existing checksum annotation.
  data: ""
  # Example:
  # data: |
  #   targets:
  #     - name: legacy_eu
  #       collector: legacy_text
  #       target: http://legacy.eu.example:8080
  #       request:
  #         path: /status
  #         timeout: 5s
  #       labels:
  #         region: eu
  #       otlp:
  #         service_name: legacy-app
  #         resource_attributes:
  #           deployment.environment: production

config:
  enabled: true
  data:
    config.yaml: |
      collectors:
        - name: example
          request:
            path: /status
          transform:
            type: regex
          metrics:
            - name: example_status
              description: Example status value
              type: gauge
              error_mode: log
              labels: []
              expression: 'status:\s+(\d+(?:\.\d+)?)'
monitors: []
# Example:
# monitors:
#   - name: application-services
#     enabled: true
#     type: service # service or pod
#     interval: 30s
#     scrapeTimeout: 10s
#     labels: {}
#     annotations: {}
#     targetSelector: {}
#     collector: example
#     relabelings: []
#     metricRelabelings: []
#     headers: {}
#     # Optional /probe request parameter overrides. Values must be lists.
#     params:
#       method: [POST]
#       path: [/api/status]
#       timeout: [5s]
#       body: [raw request body]
#     auth:
#       enabled: false
#       type: bearer # bearer or basic
#       secretName: ""
#       secretKey: token
#       usernameKey: username
#       passwordKey: password
#       optional: false
selfMetrics:
  path: /self-metrics
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}
  relabelings: []
  metricRelabelings: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
nodeSelector: {}
tolerations: []
affinity: {}
networkPolicy:
  enabled: false
  ingress: []
  egress: []
targetAuth:
  enabled: false
  type: bearer # bearer or basic
  secretName: ""
  secretKey: token
  fileName: token
  usernameKey: username
  passwordKey: password
  mountPath: /var/run/prometheus-universal-exporter/target-auth
  usernameFileName: username
  passwordFileName: password
# For basic auth from a Secret, set enabled: true and type: basic, then
# reference the mounted files from a collector:
# request:
#   basic_auth_file:
#     username: /var/run/prometheus-universal-exporter/target-auth/username
#     password: /var/run/prometheus-universal-exporter/target-auth/password
