# yaml-language-server: $schema=https://raw.githubusercontent.com/eenchev/prometheus-universal-exporter/main/configs/config.schema.json
otlp:
  enabled: false
  # endpoint: http://otel-collector:4318/v1/metrics
  timeout: 5s
  # Metrics are batched and exported at this interval.
  interval: 30s
  # Export requests are gzipped; none sends them uncompressed.
  # compression: gzip
  # While the endpoint fails, undelivered data points wait for the next
  # export, the oldest dropped past this many.
  # max_pending_points: 100000
  # Answer /ready with 503 after this many failed exports in a row. Off (0) by
  # default: set it only where delivering over OTLP is the exporter's job.
  # unready_after_failures: 3
  # headers:
  #   X-OTLP-Tenant: production
  # service_name: prometheus-universal-exporter
  # tls:
  #   ca_file: /etc/prometheus/tls/ca.crt
  #   cert_file: /etc/prometheus/tls/client.crt
  #   key_file: /etc/prometheus/tls/client.key
  #   insecure_skip_verify: false
  # resource_attributes:
  #   deployment.environment: production

# Optional exporter endpoint protection. Do not enable this together with a
# collector using request.forward_authorization; both use the incoming
# Authorization header for different purposes.
# web:
#   basic_auth:
#     enabled: true
#     username: exporter
#     password: change-me
#     # Or from files, such as a mounted Kubernetes Secret, read again when
#     # they change: username_file and password_file.
#     # password_file: /var/run/prometheus-universal-exporter/web-auth/password
#   self_metrics:
#     # Adds a series per collector, request URL and method with the last
#     # scrape's status, timestamp and duration. A request URL is an unbounded
#     # label value, so tracking is capped at 1000 combinations and
#     # http_exporter_request_series_capped reports when the cap is reached.
#     # The url label carries scheme, host and path only; credentials and the
#     # query string are never put in a label.
#     verbose: false

# A top-level key starting with x- is this file's own: the exporter ignores
# it. It is the place for settings several collectors share, written once as
# a YAML anchor (&name) and merged into each with <<: *name. A key set next to
# the merge replaces that key of the anchor whole.
x-guarded-request: &guarded_request
  type: http
  # Hosts, globs, addresses and CIDR networks a collector's requests may not
  # reach, whoever names the target: here the exporter's own host. A refused
  # probe is answered 403. allowed_targets, when set, is the only place
  # requests may go. The cloud metadata service, 169.254.169.254 and
  # fd00:ec2::254, is refused by every collector unless allowed_targets
  # lists it.
  denied_targets: [127.0.0.0/8, "::1"]
  # allowed_targets: ["*.internal.example", 10.0.0.0/8]

# Further collectors can live in files of their own, each holding a collectors
# list and nothing else. Entries are paths or glob patterns relative to this
# file. A collector name must be unique across this file and all of them.
# collector_files:
#   - collectors.d/*.yaml

collectors:
  - name: app_json
    # Optional in-memory response cache. A repeat of the same probe within this
    # interval is answered from memory instead of contacting the target. The
    # cached entry is keyed on the whole request, so a probe with different (or
    # missing) parameters, headers, or credentials never reads it. Omit or set
    # 0s to disable caching, which is the default.
    cache:
      ttl: 60s
    # How many trips to its targets this collector makes at once; a probe over
    # the limit is answered 503 at once. Omit or 0 for the default, 32.
    # max_concurrent_probes: 8
    # What to do with a metric or label name that is not a classic Prometheus
    # name, such as http.server.duration from a Prometheus 3 target: fail the
    # scrape (the default), or export it escaped as http_server_duration
    # (underscores) or U__http_2e_server_2e_duration (values).
    # name_escaping: underscores
    request:
      # Required. How this collector reaches its data; http is the only type
      # today, and each type accepts its own request keys and probe parameters.
      type: http
      method: GET
      path: /api/status
      # A path may take values from the probe: {{param_tenant}} is filled from
      # &param_tenant=... on /probe, and {{param_version:2}} falls back to 2.
      # A placeholder with no default that the probe omits is a 400.
      # path: /api/{{param_tenant}}/v{{param_version:2}}/status
      # body: |
      #   raw request body for POST or PUT requests
      headers:
        Accept: application/json
      # Optional target TLS settings. Keep certificate verification enabled
      # unless the target cannot provide a verifiable certificate.
      # tls:
      #   ca_file: /etc/prometheus/tls/ca.crt
      #   cert_file: /etc/prometheus/tls/client.crt
      #   key_file: /etc/prometheus/tls/client.key
      #   insecure_skip_verify: false
      # Follow HTTP redirect statuses on the target request. Defaults to
      # false, so a redirect is returned as-is and fails the probe rather
      # than sending the scrape to another host.
      # follow_redirects: false
      # Allow the target request to negotiate HTTP/2. Negotiated through ALPN
      # over TLS, so it applies to HTTPS targets. Defaults to false.
      # enable_http2: false
      # Optional fixed-delay retries for transient target failures.
      # retry:
      #   attempts: 2
      #   backoff: 2s
      # Statuses whose answers are decoded, every 2xx by default: a health
      # endpoint that reports its checks with 503 can be read too. Rules
      # read the status as $status and the headers as $headers.
      # accept_status: ["2xx", 503]
    # limits:
    #   # Maximum live cache entries for this collector. Defaults to 1000.
    #   max_cache_entries: 1000
    #   # The most memory each of this collector's Python workers, which run
    #   # the pre_script below, may use; at least 32MiB, unbounded by default.
    #   max_script_memory: 256MiB
    decoder:
      type: json
    transform:
      type: jq
      # Optional: runs once after decoding and before all metric expressions.
      # It must leave its result in `data`, which is the variable the exporter
      # reads back; a script that produces nothing in `data` is rejected at
      # startup. Mutating it in place counts, as here.
      pre_script: |
        data["requests"] = data.get("requests", 0)
    metrics:
      - name: application_requests_total
        description: Total application requests
        type: counter
        # What happens when this value cannot be extracted: ignore drops the
        # metric silently, log (the default) drops it and logs why, and fail
        # fails the whole probe with a JSON error instead of serving the rest.
        error_mode: log
        expression: .requests
        labels:
          - name: environment
            expression: .environment
            # Turns a value into another; "*" catches the rest, and "" leaves
            # the label off.
            # value_map: {prod: production, stg: staging}
      # Text to a number with value_map ("*" for anything else), and a unit
      # change with scale:
      # - name: application_state
      #   expression: .state
      #   value_map: {up: 1, degraded: 0.5, down: 0, "*": -1}
      # - name: application_latency_seconds
      #   expression: .latency_ms
      #   scale: 0.001

  # Set targetAuth.enabled=true in the Helm chart and store the token in the
  # configured Secret key when using this file-based target credential.
  # - name: protected_status
  #   request:
  #     path: /status
  #     bearer_token_file: /var/run/prometheus-universal-exporter/target-auth/token

  - name: legacy_text
    request:
      <<: *guarded_request
      path: /status
      # Monitor credentials and selected headers can be propagated explicitly.
      # forward_authorization: true
      # forward_headers: [X-Tenant]
    transform:
      type: regex
    metrics:
      - name: application_connections
        description: Current application connections
        type: gauge
        error_mode: log
        labels: []
        expression: 'Connections:\s+(\d+)'

  - name: app_csv
    request:
      <<: *guarded_request
      path: /status.csv
    transform:
      type: csv
    metrics:
      - name: server_cpu
        description: Server CPU utilization
        type: gauge
        error_mode: log
        expression: cpu
        labels:
          - name: server
            expression: server

  - name: vendor_prometheus
    # Optional. Joined with "_" to the front of every metric this collector
    # exports, so the rule below is exported as vendor_requests_total. It must
    # start with a letter and use only letters, digits, and single underscores
    # between them, without a trailing underscore.
    metrics_prefix: vendor
    request:
      type: http
      path: /metrics
    transform:
      type: prometheus
    metrics:
      - name: requests_total
        description: Vendor HTTP requests
        type: counter
        error_mode: log
        labels: []
        expression: '^vendor_requests_total$'

  # When a response only needs parsing, let Python reshape it and declare the
  # metrics like every other collector. A pre-script that returns a mapping or a
  # sequence becomes the decoded response for the jq, yq, and none transforms,
  # whatever the endpoint actually returned.
  - name: worker_cpu
    request:
      type: http
      path: /status
    decoder:
      type: text
    transform:
      type: jq
      pre_script: |
        import re
        data = {"workers": [{"name": m.group(1), "cpu": int(m.group(2))}
                            for m in re.finditer(r"Worker (\S+) CPU: (\d+)%", response.text)]}
    metrics:
      - name: vendor_worker_cpu
        description: Worker CPU utilization
        type: gauge
        error_mode: log
        expression: .workers[].cpu
        labels:
          - name: worker
            expression: .workers[].name

  # Reserve the Python transform for collectors whose metric names are not known
  # until the response is read. It emits through metric(...) and needs no
  # metrics array; error_mode, required, description, and type do not apply to
  # metrics produced this way.
  - name: custom_python
    request:
      type: http
      path: /status
    decoder:
      type: text
    transform:
      type: python
      script: |
        import re
        for line in response.text.splitlines():
            match = re.match(r"(\w+)\s*=\s*(\d+)", line)
            if match:
                metric(name="vendor_" + match.group(1).lower(), type="gauge",
                       value=float(match.group(2)))

  # Read a file from the exporter's own filesystem instead of calling a URL.
  # root is the only directory the collector may read under; nothing outside
  # it is reachable, through .. or a symbolic link. Here, the Prometheus text
  # files a batch job leaves for node_exporter's textfile collector, passed
  # through as they are. Probe it with /probe?collector=textfile, or name a
  # file under root as the target: /probe?collector=textfile&target=backup.prom.
  # See docs/LOCALFILE.md.
  - name: textfile
    request:
      type: localfile
      root: /var/lib/node_exporter/textfile_collector
      path: batch.prom
      # A writer that has stopped would leave its last values exported
      # forever; refuse a file older than this instead.
      max_age: 1h
    transform:
      type: prometheus

  # The whole directory, as node_exporter's textfile collector reads it: every
  # file matching files is checked on its own, its series get a file label,
  # and localfile_mtime_seconds{file} and localfile_scrape_error{file} report
  # each file, so one broken file fails alone. Probe it with
  # /probe?collector=textfiles. See docs/LOCALFILE.md#reading-a-directory.
  - name: textfiles
    request:
      type: localfile
      root: /var/lib/node_exporter/textfile_collector
      files: ["*.prom"]
      # Bounds on one scrape: files beyond max_files are skipped and logged,
      # and a file that would take the scrape past max_total_bytes, or is over
      # max_response_bytes on its own, is refused without being read.
      max_files: 100
      max_total_bytes: 64MiB
      max_age: 1h
    transform:
      type: prometheus
