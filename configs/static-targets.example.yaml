# yaml-language-server: $schema=https://raw.githubusercontent.com/eenchev/prometheus-universal-exporter/main/configs/static-targets.schema.json
# Static targets, scraped by the exporter itself on their own intervals.
#
# Pass this file with --static-targets-file. The latest result of every target
# is served together at --web.static-targets-path (/static-targets by default)
# for Prometheus to scrape, each series labelled static_target with the
# target's name, alongside http_exporter_target_up and
# http_exporter_target_scrape_duration_seconds. A target with
# export_via_otlp: true is also delivered over OTLP on otlp.interval, which
# needs otlp.enabled in the exporter configuration. Static targets are not
# reachable through /probe. The selected collector's cache, retries, limits
# and error handling all still apply.

# How often a target that sets no interval is scraped. Required.
interval: 1m
targets:
  - name: legacy_eu
    # Any collector defined in the exporter configuration.
    collector: legacy_text
    target: http://legacy.eu.example:8080
    # This target's own scrape interval, overriding the one above. At least
    # 1s, and no shorter than request.timeout.
    interval: 30s

    # Every per-scrape parameter the /probe endpoint accepts is available here
    # and overrides the collector's own request settings for this target.
    request:
      method: GET
      path: /status
      # body: |
      #   raw request body for POST or PUT requests
      timeout: 5s
      # Disabling certificate verification is an explicit security trade-off.
      # insecure_skip_verify: false
      # Both default to false, as they do on the collector.
      # follow_redirects: false
      # enable_http2: false
      retry:
        attempts: 2
        backoff: 2s
      headers:
        X-Tenant: team-a
      # Target credentials. Prefer the file-backed forms so secrets stay in a
      # mounted Secret rather than in this document.
      # bearer_token: monitor-token
      # bearer_token_file: /var/run/prometheus-universal-exporter/target-auth/token
      # basic_auth:
      #   username: exporter
      #   password: change-me
      # basic_auth_file:
      #   username: /var/run/prometheus-universal-exporter/target-auth/username
      #   password: /var/run/prometheus-universal-exporter/target-auth/password

    # Added to every metric this target produces. A label the collector already
    # extracted is never overwritten. static_target is set by the endpoint.
    labels:
      region: eu
      environment: production

    # Also deliver this target's results over OTLP, on otlp.interval, besides
    # serving them on the static targets endpoint. Off by default; needs
    # otlp.enabled in the exporter configuration.
    export_via_otlp: true
    # OTLP resource identity for this target, only with export_via_otlp. Both
    # fall back to the exporter's otlp.service_name and
    # otlp.resource_attributes; resource_attributes set here are merged over
    # the exporter-wide ones.
    otlp:
      service_name: legacy-app
      resource_attributes:
        deployment.environment: production
        team: platform

  - name: legacy_us
    collector: legacy_text
    target: http://legacy.us.example:8080
    request:
      path: /status
    labels:
      region: us
    # Served on the static targets endpoint only.

  # A localfile collector reads a file under its request.root. The target names
  # a file or directory under that root, or is left out when the collector's
  # request.path names the file; only path and timeout may be set here.
  - name: nightly_backup
    collector: textfile
    target: backup.prom
    labels:
      job: backup
