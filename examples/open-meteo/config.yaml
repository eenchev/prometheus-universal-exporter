# Current weather from Open-Meteo (https://open-meteo.com): free, no API key,
# for non-commercial use up to 10,000 calls a day. The probe's target is the
# API, https://api.open-meteo.com, and the location comes from the probe's
# param_latitude and param_longitude (Sofia by default).
collectors:
  - name: open_meteo_current
    # Open-Meteo refreshes current conditions every 15 minutes; a probe
    # within 5 minutes of the last one for the same place is answered from
    # memory, and while the API is down the last result is served for up to
    # an hour, marked stale.
    cache:
      ttl: 5m
      stale_if_error: 1h
    request:
      type: http
      path: /v1/forecast
      query:
        latitude: "{{param_latitude:42.6977}}"
        longitude: "{{param_longitude:23.3219}}"
        current: temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day
        # Base units, as Prometheus names them: metres per second.
        wind_speed_unit: ms
      allowed_schemes: [https]
      retry:
        attempts: 1
        backoff: 2s
    decoder:
      type: json
    transform:
      type: jq
    metrics:
      # Every series carries the grid point Open-Meteo answered for, so
      # probes of different places never overwrite each other.
      - name: weather_temperature_celsius
        description: Air temperature 2 m above ground.
        expression: .current.temperature_2m
        labels: &location
          - name: latitude
            expression: .latitude | tostring
          - name: longitude
            expression: .longitude | tostring
      - name: weather_apparent_temperature_celsius
        description: Feels-like temperature, from temperature, humidity and wind.
        expression: .current.apparent_temperature
        labels: *location
      - name: weather_relative_humidity_ratio
        description: Relative humidity 2 m above ground, from 0 to 1.
        expression: .current.relative_humidity_2m / 100
        labels: *location
      - name: weather_precipitation_millimeters
        description: Rain, showers and snow in the preceding 15 minutes.
        expression: .current.precipitation
        labels: *location
      - name: weather_cloud_cover_ratio
        description: Total cloud cover, from 0 to 1.
        expression: .current.cloud_cover / 100
        labels: *location
      - name: weather_pressure_msl_hectopascals
        description: Air pressure reduced to mean sea level.
        expression: .current.pressure_msl
        labels: *location
      - name: weather_wind_speed_meters_per_second
        description: Wind speed 10 m above ground.
        expression: .current.wind_speed_10m
        labels: *location
      - name: weather_wind_gusts_meters_per_second
        description: Wind gusts 10 m above ground.
        expression: .current.wind_gusts_10m
        labels: *location
      - name: weather_wind_direction_degrees
        description: Direction the wind blows from, 0 for north, 90 for east.
        expression: .current.wind_direction_10m
        labels: *location
      - name: weather_code
        description: WMO weather interpretation code, such as 0 for clear sky, 61 for slight rain, 95 for thunderstorm.
        expression: .current.weather_code
        labels: *location
      - name: weather_is_day
        description: 1 during daylight at the location, 0 at night.
        expression: .current.is_day
        labels: *location
      - name: weather_observation_timestamp_seconds
        description: Unix time the current conditions are for.
        expression: .current.time + ":00Z" | fromdateiso8601
        labels: *location
