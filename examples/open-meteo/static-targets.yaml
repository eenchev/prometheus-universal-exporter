# The exporter scrapes these itself, every 10 minutes, and serves them
# together on /static-targets. Each target is a place; its params fill the
# collector's placeholders, and its labels name it.
#
# x-open-meteo is this file's own key, which the exporter ignores: it holds
# what every target shares, merged into each with <<: *open_meteo.
x-open-meteo: &open_meteo
  collector: open_meteo_current
  target: https://api.open-meteo.com
interval: 10m
targets:
  - <<: *open_meteo
    name: sofia
    params:
      param_latitude: "42.6977"
      param_longitude: "23.3219"
    labels:
      city: Sofia
  - <<: *open_meteo
    name: plovdiv
    params:
      param_latitude: "42.1354"
      param_longitude: "24.7453"
    labels:
      city: Plovdiv
  - <<: *open_meteo
    name: varna
    params:
      param_latitude: "43.2141"
      param_longitude: "27.9147"
    labels:
      city: Varna
