apiVersion: v1
kind: Service
metadata:
  name: generic-http-exporter
  labels: {app: generic-http-exporter}
spec:
  selector: {app: generic-http-exporter}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: legacy-text
spec:
  selector:
    matchLabels: {app: legacy-target}
  endpoints:
    - port: http
      path: /probe
      params:
        collector: [legacy_text]
        # Non-secret monitor parameters become target headers only when the
        # selected collector allowlists X-Tenant in request.forward_headers.
        header_X-Tenant: [team-a]
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: __param_target
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: generic-http-exporter:8080
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: legacy-text-pods
spec:
  selector:
    matchLabels: {app: legacy-target}
  podMetricsEndpoints:
    - port: http
      path: /probe
      params:
        collector: [legacy_text]
        header_X-Tenant: [team-a]
      # For a Secret-backed bearer token, use this instead of embedding a
      # token in params; the selected collector must opt in to propagation.
      # authorization:
      #   type: Bearer
      #   credentials:
      #     name: target-api-token
      #     key: token
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: __param_target
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: generic-http-exporter:8080
